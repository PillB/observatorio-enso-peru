# Niño Costero 2017: los diez distritos con más viviendas inhabitables o colapsadas según el Plan Integral
# de Reconstrucción con Cambios (versión para consulta del 18 de agosto de 2017, tabla 27, con datos del
# Ministerio de Vivienda al 8 de agosto de 2017). «Viviendas» = inhabitables (daños estructurales
# recuperables) + colapsadas (daños irreparables); el plan no las separa por distrito.
#
# Formato (docs/memoria-desastres.md, «Registros curados»): cada registro necesita Id, Date, DangerType,
# el lugar (Ubigeo o nombres), Fuente (https) y FuenteCita; lo que va en «comun» se aplica a todos.
comun:
  Date: "2017-03"
  PrecisionFecha: mes
  DangerType: Inundacion
  PeligroFuente: "El Niño Costero (inundaciones y movimientos en masa)"
  Fuente: https://elregionalpiura.com.pe/web-pdf/Plan-Integral-de-Reconstruccion-con-Cambios-18082017.pdf
  FuenteCita: >-
    Autoridad para la Reconstrucción con Cambios, Plan Integral de Reconstrucción con Cambios, versión para
    consulta de gobiernos regionales y locales (18 de agosto de 2017), tabla 27 «Distritos más afectados a
    nivel nacional» (fuente: Ministerio de Vivienda, Construcción y Saneamiento, al 08/08/2017). Copia
    publicada por El Regional de Piura.
  Licencia: Documento público del Estado peruano
registros:
