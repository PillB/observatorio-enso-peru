# Conciliación de cifras de personas con la población oficial de su área (enso/historico/conciliacion.py).
#
# Cada fila del catálogo con más personas afectadas, damnificadas, evacuadas, reubicadas o desplazadas que habitantes
# en su área en el año del evento (INEI: estimaciones 1990-2005, censo 2017, proyecciones 2018-2022) se investigó con
# su propio texto, las fichas de los mismos días en el área y la población de cada nivel (y, si hizo falta, otras
# fuentes). Aquí están las que tienen una ruta propia; las demás son fichas de un distrito (el SINPAD registra cada
# emergencia en uno) que se llevan a la población del distrito (tope-poblacion, automática).
#
# Rutas (campos):
#   cifra-de-area  area      la cifra es de la provincia o el departamento: cuenta ahí y no en el distrito
#   homonimo       ubigeo    la fuente nombró el departamento o la provincia de ese nombre: la fila pasa ahí
#   duplicado      de        la cifra repite la de otra fila que la consolida: se cuenta una vez, en esa
#   consolidado    partes    la fila es el total de un área cuyas partes tienen filas: cuenta el resto
#   transcripcion  cifras    la cifra se corrige con la propia fila
#   tope-poblacion           investigada: se cuenta toda la población del área
# Todas llevan motivo (lo que dice la fila) y evidencia (con qué se comprobó). «area» en otra ruta dice además de qué
# área es la cifra que queda. La población de cada área y año la calcula la construcción y queda en
# conciliaciones.csv.
conciliaciones:
  # --- Cifras de un área mayor -----------------------------------------------------------------------------------
  - id: desinventar-43412
    ruta: cifra-de-area
    area: "02"
    motivo: «Unos ochenta mil pobladores de los centros poblados quedaron aislados a causa del derrumbe en el camino».
    evidencia: >-
      Son las personas aisladas por el corte de la vía, no las del distrito: 80 000 no caben en Santa Rosa (1 578
      habitantes en 2008) ni en toda la provincia de Pallasca (30 631); sí en Áncash.
  - id: desinventar-31682
    ruta: cifra-de-area
    area: "02"
    motivo: >-
      Derrumbes en la vía Huaraz-Huallanca-Chuquicara-Pomabamba; la ficha nombra como afectadas las provincias de
      Corongo, Sihuas y otras.
    evidencia: Cuatro provincias de Áncash; 60 000 no caben en La Pampa (1 446) ni en Corongo (9 258).
  - id: desinventar-37083
