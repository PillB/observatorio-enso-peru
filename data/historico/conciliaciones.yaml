  - id: desinventar-29702
    ruta: transcripcion
    cifras: {PerdidasUSD: 446809}
    motivo: >-
      Inundación de arrozales en Guadalupe (El Comercio, 06/05/1983): 350 ha perdidas que «equivale[n] a 630
      mil30 millones… de soles» (texto dañado al digitar).
    evidencia: >-
      630 millones de soles a 1 410 por dólar (mayo de 1983) son 446 809 dólares, lo que valen 350 ha de arroz a las
      5 toneladas por hectárea que da la nota (unas 1 750 t); la ficha tiene 10 veces más. Leído como 630 mil
      millones serían 447 millones de dólares por 350 ha.
