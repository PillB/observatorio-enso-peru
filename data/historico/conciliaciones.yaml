  # --- Pérdidas en dólares ------------------------------------------------------------------------------------
  # DesInventar convierte los soles de la nota a dólares con un tipo de cambio por mes, que se lee en sus propias
  # fichas (pérdida en soles del texto / PerdidasUSD): 73,5 soles por dólar en marzo de 1977; 1 030 en enero de
  # 1983, 1 100 en febrero, 1 170 en marzo, 1 300 en abril, 1 410 en mayo, 1 530 en junio, 1 870 en agosto; 2 320
  # en enero de 1984. Estas fichas se apartan de su propio texto por 10, 100 o 1 000 (un cero o tres de más o de
  # menos), o pasan lo posible (el PBI del Perú en 1983 fue de 17 345 millones de dólares, Banco Mundial,
  # NY.GDP.MKTP.CD).
  - id: desinventar-28595
    ruta: transcripcion
    cifras: {PerdidasUSD: 317050000}
    motivo: >-
      Balance de la sequía de 1983 en Puno (El Comercio, 12/08/1983): «Valor de pérdidas: 592 millones 884 miles de
      soles en el agro».
    evidencia: >-
      Los 43 961 millones de dólares de la ficha son 2,5 veces el PBI del Perú de 1983 y no salen del texto. Leído al
      pie de la letra, el texto da 592 884 000 soles (317 050 dólares a 1 870), menos que las pérdidas de un solo
      distrito en febrero (Capachica, desinventar-28601: 31 707 millones de soles) y que la estimación preliminar de
      junio para Puno (desinventar-28592: 200 mil millones de soles en el agro, la ganadería y la artesanía) en una
      sequía que afectó al 80 % de las unidades agropecuarias. Leído como 592 884 millones de soles, que es como
      coincide con esas estimaciones, son 317 050 000 dólares a 1 870 soles por dólar (agosto de 1983).
  - id: desinventar-29223
    ruta: transcripcion
    cifras: {PerdidasUSD: 1027273}
    motivo: >-
      Lluvias en cinco pueblos jóvenes de Chiclayo (9 de Octubre, César Vallejo, San Antonio, Buenos Aires, Ricardo
      Palma) en febrero de 1983; la cifra en soles se perdió al digitar («Pérdidas desde Enero… es de soles»).
    evidencia: >-
      1 027 millones de dólares son el 5,9 % del PBI del Perú de 1983 (17 345 millones) para cinco barrios; son
      1 130 000 millones de soles a 1 100 (febrero de 1983). Con tres ceros menos, 1 130 millones de soles, son
      1 027 273 dólares: el mismo error de las fichas de Arequipa 1977, Camaná 1984 e Iquitos 1994.
  - id: desinventar-42666
    ruta: transcripcion
    cifras: {PerdidasUSD: 272000}
    motivo: >-
      Tormenta eléctrica en Arequipa (El Comercio, 14/03/1977): «Vp. Ascienden a 20 millones de soles».
    evidencia: >-
      20 millones de soles a 73,5 por dólar (marzo de 1977) son unos 272 000 dólares; la ficha dice 272 (en miles).
  - id: desinventar-42470
    ruta: transcripcion
    cifras: {PerdidasUSD: 43103}
    motivo: >-
      Sequía en el arroz de Camaná (El Comercio, 03/01/1984), «Datos consolidados fichas 82100-102»: «tendrá una
      pérdida bruta del 30% (100 millones de soles)».
    evidencia: >-
      100 millones de soles a 2 320 por dólar (enero de 1984) son 43 103 dólares; la ficha tiene 1 000 veces más
      (43 103 448) y las otras dos fichas de la nota, 100 veces más (4 303 448).
  - id: desinventar-42468
    ruta: duplicado
    de: desinventar-42470
    columnas: [PerdidasUSD]
    motivo: >-
      «Campaña arrocera 1983-84 se perderá el orden del 30% (100 millones de soles)», en El Cardo.
    evidencia: >-
      La misma pérdida de la misma nota para los tres distritos arroceros de Camaná; la ficha consolidada
      (desinventar-42470) la cuenta una vez. Esta tenía además 100 veces los dólares (4 303 448).
  - id: desinventar-42469
    ruta: duplicado
    de: desinventar-42470
    columnas: [PerdidasUSD]
    motivo: >-
      «Campaña arrocera 1983-84 se perderá el orden del 30% (100 millones de soles)», en San José.
    evidencia: >-
      La misma pérdida de la misma nota para los tres distritos arroceros de Camaná; la ficha consolidada
      (desinventar-42470) la cuenta una vez. Esta tenía además 100 veces los dólares (4 303 448).
  - id: desinventar-41481
    ruta: transcripcion
    cifras: {PerdidasUSD: 6153846}
    motivo: >-
      Sequía en los distritos de riego de Sama y Candarave (El Comercio, 13/04/1983): «Más de 8 mil millones de soles
      en agricultura y ganadería».
    evidencia: >-
      8 mil millones de soles a 1 300 por dólar (abril de 1983, el de otras seis fichas del mes) son 6 153 846
