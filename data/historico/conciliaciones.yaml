  # --- Tope en la población, investigado ------------------------------------------------------------------------
  - id: sinpad-145223
    ruta: tope-poblacion
    motivo: >-
      Los 3 509 desplazados vienen del IDMC; la evaluación de daños del SINPAD de la emergencia tiene 4 damnificados
      y 1 vivienda.
    evidencia: >-
      El INGEMMET halló un deslizamiento-flujo reactivado el 24 de noviembre de 2021 que bordeó el área poblada de
      Recta y, tras el sismo del 28 de noviembre, recomendó reubicar a la población del distrito en Jumbilla
      (andina.pe, «Ingemmet recomienda reubicar a pobladores de Recta»): los desplazados son toda la población de
      Recta; el resto de la cifra del IDMC es del sismo en otros distritos.
  - id: sinpad-00086881
    ruta: tope-poblacion
    motivo: Huaico que «afecta localidades del distrito de Calango», con 55 evaluaciones de daños en el SINPAD.
    evidencia: >-
      11 705 afectados son 4,7 veces la población de Calango (2 501 en el censo de 2017). El SINPAD suma las 55
      evaluaciones de la emergencia, que se repiten sobre los mismos poblados en marzo de 2017; ninguna ficha de los
      distritos vecinos del valle de Mala tiene cifras ese día, así que no es la de un área mayor.
