  <text class="arch-h" x="30" y="684">6 · Operación en GitHub Actions</text>
  <rect class="arch-key" x="28" y="698" width="220" height="94" rx="8"/>
  <text class="arch-t" x="40" y="718">observatory · diario 23:37 Lima</text>
  <text class="arch-s" x="40" y="736">pruebas → pipeline → recorridos</text>
  <text class="arch-s" x="40" y="751">de navegador → despliegue →</text>
  <text class="arch-s" x="40" y="766">verificación del sitio en vivo;</text>
  <text class="arch-s" x="40" y="781">si algo falla, queda el anterior</text>
  <rect class="arch-box" x="260" y="698" width="220" height="94" rx="8"/>
  <text class="arch-t" x="272" y="718">watchdog · cada 6 h</text>
  <text class="arch-s" x="272" y="736">si la publicación tiene más</text>
  <text class="arch-s" x="272" y="751">de 30 h, relanza la corrida</text>
  <text class="arch-s" x="272" y="766">y abre un issue</text>
  <rect class="arch-box" x="492" y="698" width="220" height="94" rx="8"/>
  <text class="arch-t" x="504" y="718">ci</text>
  <text class="arch-s" x="504" y="736">pruebas, backtesting de</text>
  <text class="arch-s" x="504" y="751">formatos y 16 dispositivos</text>
  <text class="arch-s" x="504" y="766">en cada cambio</text>
  <rect class="arch-box" x="724" y="698" width="220" height="94" rx="8"/>
  <text class="arch-t" x="736" y="718">Sondeos de fuentes</text>
  <text class="arch-s" x="736" y="736">probe-sources · probe-feeds</text>
  <text class="arch-s" x="736" y="751">scrape-ladder · capture-</text>
  <text class="arch-s" x="736" y="766">fixtures → ramas bot/…</text>
  <rect class="arch-box" x="956" y="698" width="220" height="94" rx="8"/>
  <text class="arch-t" x="968" y="718">Incidencias → issues</text>
  <text class="arch-s" x="968" y="736">se abren y se cierran solas;</text>
  <text class="arch-s" x="968" y="751">n8n vigila el sitio cada 6 h</text>
</svg>
