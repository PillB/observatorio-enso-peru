<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 808" role="img" aria-labelledby="arch-t arch-d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
  <title id="arch-t">Arquitectura del Observatorio ENSO Perú</title>
  <desc id="arch-d">Las fuentes oficiales del ENSO, las alertas de peligros (INDECI, SENAMHI, DHN, IGP, USGS, PTWC, NASA FIRMS) y los feeds de noticias se obtienen por el canal más simple que funciona: directo desde GitHub Actions, n8n en la nube, el recolector en el Perú solo para fuentes geobloqueadas, el Internet Archive o la publicación anterior. El pipeline en Python lee, homologa, ubica por distrito, provincia y departamento, valida y publica de forma atómica, con una copia archivada y la respuesta original de cada ítem; el sitio estático en Cloudflare Pages las muestra con enlaces a la fuente en vivo.</desc>
  <style>
    .arch-bg { fill: var(--bg-elev, #ffffff); }
    .arch-col { fill: var(--bg-sunk, #eef2f6); }
    .arch-box { fill: var(--bg-elev, #ffffff); stroke: var(--line, #c9d3de); stroke-width: 1.2; }
    .arch-key { fill: var(--bg-elev, #ffffff); stroke: var(--brand, #0b4f71); stroke-width: 1.6; }
    .arch-warn { fill: var(--bg-elev, #ffffff); stroke: var(--watch, #8a5a00); stroke-width: 1.4; stroke-dasharray: 5 3; }
    .arch-h { fill: var(--fg, #0d1b2a); font-size: 15px; font-weight: 700; }
    .arch-t { fill: var(--fg, #0d1b2a); font-size: 12.5px; font-weight: 700; }
    .arch-s { fill: var(--fg-3, #5d6e82); font-size: 11px; }
    .arch-n { fill: var(--brand, #0b4f71); font-size: 11px; font-weight: 700; }
    .arch-line { stroke: var(--fg-3, #5d6e82); stroke-width: 1.4; fill: none; }
    .arch-dash { stroke: var(--fg-3, #5d6e82); stroke-width: 1.2; fill: none; stroke-dasharray: 4 3; }
    .arch-head { fill: var(--fg-3, #5d6e82); }
    @media (prefers-color-scheme: dark) {
      .arch-bg { fill: var(--bg-elev, #0f1c2b); } .arch-col { fill: var(--bg-sunk, #0b1622); }
      .arch-box, .arch-key, .arch-warn { fill: var(--bg-elev, #0f1c2b); }
      .arch-h, .arch-t { fill: var(--fg, #e3ebf3); } .arch-s { fill: var(--fg-3, #8d9db0); }
      .arch-n { fill: var(--brand, #5cc3e6); } .arch-line, .arch-dash { stroke: var(--fg-3, #8d9db0); }
      .arch-head { fill: var(--fg-3, #8d9db0); }
    }
  </style>
  <defs>
    <marker id="arch-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="arch-head" d="M0 0L10 5L0 10z"/>
    </marker>
  </defs>
  <rect class="arch-bg" x="0" y="0" width="1200" height="808" rx="14"/>

  <rect class="arch-col" x="16" y="16" width="220" height="640" rx="10"/>
  <rect class="arch-col" x="254" y="16" width="210" height="640" rx="10"/>
  <rect class="arch-col" x="482" y="16" width="236" height="640" rx="10"/>
  <rect class="arch-col" x="736" y="16" width="210" height="640" rx="10"/>
  <rect class="arch-col" x="964" y="16" width="220" height="640" rx="10"/>
  <text class="arch-h" x="30" y="42">1 · Fuentes</text>
  <text class="arch-h" x="268" y="42">2 · Canales</text>
  <text class="arch-h" x="496" y="42">3 · Pipeline (python/enso)</text>
  <text class="arch-h" x="750" y="42">4 · Publicación</text>
  <text class="arch-h" x="978" y="42">5 · Sitio</text>

  <!-- 1 · Fuentes -->
  <rect class="arch-key" x="28" y="58" width="196" height="79" rx="8"/>
  <text class="arch-t" x="40" y="78">ENSO oficial (Perú)</text>
  <text class="arch-s" x="40" y="96" xml:space="preserve">ENFEN: comunicados (PDF),</text>
  <text class="arch-s" x="40" y="111" xml:space="preserve">  portal y réplica de la DHN</text>
  <text class="arch-s" x="40" y="126" xml:space="preserve">IGP: ICEN oficial</text>
  <rect class="arch-box" x="28" y="147" width="196" height="79" rx="8"/>
  <text class="arch-t" x="40" y="167">NOAA (EE. UU.)</text>
  <text class="arch-s" x="40" y="185" xml:space="preserve">CPC: Discussion, RONI, ONI,</text>
  <text class="arch-s" x="40" y="200" xml:space="preserve">  OISST, SOI, alisios, calor</text>
  <text class="arch-s" x="40" y="215" xml:space="preserve">PSL: ERSSTv6 Niño 1+2 y 3.4</text>
  <rect class="arch-key" x="28" y="236" width="196" height="124" rx="8"/>
  <text class="arch-t" x="40" y="256">Alertas de peligros</text>
  <text class="arch-s" x="40" y="274" xml:space="preserve">INDECI: reportes del COEN</text>
  <text class="arch-s" x="40" y="289" xml:space="preserve">SENAMHI: avisos (Telegram y</text>
  <text class="arch-s" x="40" y="304" xml:space="preserve">  copia GEOSINPAD del INDECI)</text>
  <text class="arch-s" x="40" y="319" xml:space="preserve">DHN: tsunamis, oleaje y viento</text>
  <text class="arch-s" x="40" y="334" xml:space="preserve">IGP: volcanes · USGS · PTWC</text>
  <text class="arch-s" x="40" y="349" xml:space="preserve">NASA FIRMS: focos de calor</text>
  <rect class="arch-box" x="28" y="370" width="196" height="94" rx="8"/>
  <text class="arch-t" x="40" y="390">Noticias (RSS / Atom)</text>
  <text class="arch-s" x="40" y="408" xml:space="preserve">medios nacionales y regionales</text>
  <text class="arch-s" x="40" y="423" xml:space="preserve">por departamento, radios,</text>
  <text class="arch-s" x="40" y="438" xml:space="preserve">gob.pe, Google Noticias;</text>
  <text class="arch-s" x="40" y="453" xml:space="preserve">ONU, GDACS…</text>
  <rect class="arch-warn" x="28" y="474" width="196" height="64" rx="8"/>
  <text class="arch-t" x="40" y="494">Solo desde el Perú</text>
  <text class="arch-s" x="40" y="512" xml:space="preserve">web del SENAMHI, ANA, IMARPE,</text>
  <text class="arch-s" x="40" y="527" xml:space="preserve">IDESEP: no responden fuera</text>
  <rect class="arch-box" x="28" y="548" width="196" height="94" rx="8"/>
  <text class="arch-t" x="40" y="568">Registro y referencia</text>
  <text class="arch-s" x="40" y="586" xml:space="preserve">registry/sources.json: 191</text>
  <text class="arch-s" x="40" y="601" xml:space="preserve">  fuentes y su alcance por red</text>
  <text class="arch-s" x="40" y="616" xml:space="preserve">límites del INDECI, UBIGEO INEI</text>
  <text class="arch-s" x="40" y="631" xml:space="preserve">umbrales ICEN · tabla GRD</text>

  <!-- 2 · Canales -->
  <rect class="arch-key" x="266" y="58" width="186" height="109" rx="8"/>
  <text class="arch-n" x="278" y="78">1</text>
  <text class="arch-t" x="292" y="78">Directo (GitHub Actions)</text>
  <text class="arch-s" x="278" y="96" xml:space="preserve">lo más simple primero:</text>
  <text class="arch-s" x="278" y="111" xml:space="preserve">robots.txt → petición simple</text>
  <text class="arch-s" x="278" y="126" xml:space="preserve">→ cabeceras → navegador</text>
  <text class="arch-s" x="278" y="141" xml:space="preserve">→ Firecrawl. Nunca evade una</text>
  <text class="arch-s" x="278" y="156" xml:space="preserve">verificación anti-robots.</text>
  <rect class="arch-box" x="266" y="177" width="186" height="79" rx="8"/>
  <text class="arch-n" x="278" y="197">2</text>
  <text class="arch-t" x="292" y="197">n8n (nube, EE. UU.)</text>
  <text class="arch-s" x="278" y="215" xml:space="preserve">fuentes no geobloqueadas que</text>
  <text class="arch-s" x="278" y="230" xml:space="preserve">fallan desde Actions;</text>
  <text class="arch-s" x="278" y="245" xml:space="preserve">22:50 Lima → rama data-n8n</text>
  <rect class="arch-box" x="266" y="266" width="186" height="79" rx="8"/>
  <text class="arch-n" x="278" y="286">3</text>
  <text class="arch-t" x="292" y="286">Recolector en el Perú</text>
  <text class="arch-s" x="278" y="304" xml:space="preserve">solo fuentes geobloqueadas;</text>
  <text class="arch-s" x="278" y="319" xml:space="preserve">21:00 Lima → rama data-peru;</text>
  <text class="arch-s" x="278" y="334" xml:space="preserve">kit para Windows y macOS</text>
  <rect class="arch-box" x="266" y="355" width="186" height="64" rx="8"/>
  <text class="arch-n" x="278" y="375">4</text>
  <text class="arch-t" x="292" y="375">Internet Archive</text>
  <text class="arch-s" x="278" y="393" xml:space="preserve">copia exacta (CDX); pide una</text>
  <text class="arch-s" x="278" y="408" xml:space="preserve">nueva si tiene más de 24 h</text>
  <rect class="arch-box" x="266" y="429" width="186" height="64" rx="8"/>
  <text class="arch-n" x="278" y="449">5</text>
  <text class="arch-t" x="292" y="449">Publicación anterior</text>
  <text class="arch-s" x="278" y="467" xml:space="preserve">último dato válido, con su</text>
  <text class="arch-s" x="278" y="482" xml:space="preserve">fecha real</text>
  <text class="arch-s" x="278" y="519" xml:space="preserve">Cada respuesta lleva canal,</text>
  <text class="arch-s" x="278" y="534" xml:space="preserve">URL, fecha y sha256. El</text>
  <text class="arch-s" x="278" y="549" xml:space="preserve">alcance se mide por red:</text>
  <text class="arch-s" x="278" y="564" xml:space="preserve">Actions, n8n y Perú.</text>

  <!-- 3 · Pipeline (python/enso) -->
  <rect class="arch-box" x="494" y="58" width="212" height="64" rx="8"/>
  <text class="arch-t" x="506" y="78">fetch.py · reach.py</text>
  <text class="arch-s" x="506" y="96" xml:space="preserve">descarga con procedencia;</text>
  <text class="arch-s" x="506" y="111" xml:space="preserve">robots.txt según RFC 9309</text>
  <rect class="arch-box" x="494" y="132" width="212" height="79" rx="8"/>
  <text class="arch-t" x="506" y="152">feeds/ · feedparse.py</text>
  <text class="arch-s" x="506" y="170" xml:space="preserve">lectores ENSO (cpc, peru);</text>
  <text class="arch-s" x="506" y="185" xml:space="preserve">RSS/Atom tolerante: repara</text>
  <text class="arch-s" x="506" y="200" xml:space="preserve">feeds mal formados</text>
  <rect class="arch-key" x="494" y="221" width="212" height="79" rx="8"/>
  <text class="arch-t" x="506" y="241">hazardparse.py</text>
  <text class="arch-s" x="506" y="259" xml:space="preserve">HTML, ArcGIS, GeoJSON, CSV y</text>
  <text class="arch-s" x="506" y="274" xml:space="preserve">texto → el formato de una</text>
  <text class="arch-s" x="506" y="289" xml:space="preserve">noticia; omite simulacros</text>
  <rect class="arch-key" x="494" y="310" width="212" height="94" rx="8"/>
  <text class="arch-t" x="506" y="330">geo.py · geopoly.py</text>
  <text class="arch-s" x="506" y="348" xml:space="preserve">distrito, provincia y</text>
  <text class="arch-s" x="506" y="363" xml:space="preserve">departamento (UBIGEO); las</text>
  <text class="arch-s" x="506" y="378" xml:space="preserve">coordenadas, por los límites</text>
  <text class="arch-s" x="506" y="393" xml:space="preserve">oficiales del INDECI</text>
  <rect class="arch-box" x="494" y="414" width="212" height="79" rx="8"/>
  <text class="arch-t" x="506" y="434">observatory.py · signals.py</text>
  <text class="arch-s" x="506" y="452" xml:space="preserve">valida y arma series, estado</text>
  <text class="arch-s" x="506" y="467" xml:space="preserve">ENFEN y NOAA, señal GRD,</text>
  <text class="arch-s" x="506" y="482" xml:space="preserve">incidencias</text>
  <rect class="arch-box" x="494" y="503" width="212" height="79" rx="8"/>
  <text class="arch-t" x="506" y="523">news.py · sourcefeed.py</text>
  <text class="arch-s" x="506" y="541" xml:space="preserve">relevancia y peligros, agrupa</text>
  <text class="arch-s" x="506" y="556" xml:space="preserve">notas, histórico solo anexar;</text>
  <text class="arch-s" x="506" y="571" xml:space="preserve">alertas de los últimos 7 días</text>
  <text class="arch-s" x="506" y="608" xml:space="preserve">Un lector que falla registra la</text>
  <text class="arch-s" x="506" y="623" xml:space="preserve">incidencia; no tumba la corrida.</text>

  <!-- 4 · Publicación -->
  <rect class="arch-key" x="748" y="58" width="186" height="64" rx="8"/>
  <text class="arch-t" x="760" y="78">Escritura atómica</text>
  <text class="arch-s" x="760" y="96" xml:space="preserve">un publicationId común;</text>
  <text class="arch-s" x="760" y="111" xml:space="preserve">se reemplaza la carpeta entera</text>
  <rect class="arch-box" x="748" y="132" width="186" height="64" rx="8"/>
  <text class="arch-t" x="760" y="152">Datos</text>
  <text class="arch-s" x="760" y="170" xml:space="preserve">dashboard, series, weekly,</text>
  <text class="arch-s" x="760" y="185" xml:space="preserve">csv/*.csv, sources/*.json</text>
  <rect class="arch-box" x="748" y="206" width="186" height="94" rx="8"/>
  <text class="arch-t" x="760" y="226">Novedades</text>
  <text class="arch-s" x="760" y="244" xml:space="preserve">feed.json: alertas y fuentes</text>
  <text class="arch-s" x="760" y="259" xml:space="preserve">  oficiales</text>
  <text class="arch-s" x="760" y="274" xml:space="preserve">news/clusters.json, feeds.json</text>
  <text class="arch-s" x="760" y="289" xml:space="preserve">news/items.jsonl (solo anexar)</text>
  <rect class="arch-key" x="748" y="310" width="186" height="79" rx="8"/>
  <text class="arch-t" x="760" y="330">Copias que sirve el sitio</text>
  <text class="arch-s" x="760" y="348" xml:space="preserve">archive/news/&lt;día&gt;.html#&lt;id&gt;</text>
  <text class="arch-s" x="760" y="363" xml:space="preserve">archive/feeds/: la respuesta</text>
  <text class="arch-s" x="760" y="378" xml:space="preserve">  original de cada fuente</text>
  <rect class="arch-box" x="748" y="399" width="186" height="64" rx="8"/>
  <text class="arch-t" x="760" y="419">Transparencia</text>
  <text class="arch-s" x="760" y="437" xml:space="preserve">sources.json, run-report,</text>
  <text class="arch-s" x="760" y="452" xml:space="preserve">health.json, manifest.json</text>
  <rect class="arch-box" x="748" y="473" width="186" height="64" rx="8"/>
  <text class="arch-t" x="760" y="493">Rama data-archive</text>
  <text class="arch-s" x="760" y="511" xml:space="preserve">cada respuesta original nueva</text>
  <text class="arch-s" x="760" y="526" xml:space="preserve">y las notas de cada día</text>

  <!-- 5 · Sitio -->
  <rect class="arch-key" x="976" y="58" width="196" height="79" rx="8"/>
  <text class="arch-t" x="988" y="78">Cloudflare Pages</text>
  <text class="arch-s" x="988" y="96" xml:space="preserve">sin enlace al repositorio</text>
  <text class="arch-s" x="988" y="111" xml:space="preserve">(o GitHub Pages);</text>
  <text class="arch-s" x="988" y="126" xml:space="preserve">verifica el publicationId</text>
  <rect class="arch-box" x="976" y="147" width="196" height="79" rx="8"/>
  <text class="arch-t" x="988" y="167">Paneles</text>
  <text class="arch-s" x="988" y="185" xml:space="preserve">Resumen · El Niño Costero</text>
  <text class="arch-s" x="988" y="200" xml:space="preserve">Pacífico · Océano y atmósfera</text>
  <text class="arch-s" x="988" y="215" xml:space="preserve">Mapa · Historia · Datos</text>
  <rect class="arch-key" x="976" y="236" width="196" height="109" rx="8"/>
  <text class="arch-t" x="988" y="256">Noticias</text>
  <text class="arch-s" x="988" y="274" xml:space="preserve">Alertas · Perú · Mundo</text>
  <text class="arch-s" x="988" y="289" xml:space="preserve">cada ítem: fuente en vivo,</text>
  <text class="arch-s" x="988" y="304" xml:space="preserve">copia archivada y respuesta</text>
  <text class="arch-s" x="988" y="319" xml:space="preserve">original; fuentes que no</text>
  <text class="arch-s" x="988" y="334" xml:space="preserve">respondieron</text>
  <rect class="arch-box" x="976" y="355" width="196" height="64" rx="8"/>
  <text class="arch-t" x="988" y="375">Asistente</text>
  <text class="arch-s" x="988" y="393" xml:space="preserve">reglas deterministas que</text>
  <text class="arch-s" x="988" y="408" xml:space="preserve">citan la evidencia</text>
  <rect class="arch-warn" x="976" y="429" width="196" height="79" rx="8"/>
  <text class="arch-t" x="988" y="449">Consola de correcciones</text>
  <text class="arch-s" x="988" y="467" xml:space="preserve">revisores con usuario y</text>
  <text class="arch-s" x="988" y="482" xml:space="preserve">clave corrigen lugares</text>
  <text class="arch-s" x="988" y="497" xml:space="preserve">(en desarrollo)</text>

  <!-- Flujo -->
  <path class="arch-line" d="M222 98H264" marker-end="url(#arch-arrow)"/>
  <path class="arch-line" d="M222 298H264" marker-end="url(#arch-arrow)"/>
  <path class="arch-line" d="M450 112H492" marker-end="url(#arch-arrow)"/>
  <path class="arch-line" d="M450 306H492" marker-end="url(#arch-arrow)"/>
  <path class="arch-line" d="M704 90H746" marker-end="url(#arch-arrow)"/>
  <path class="arch-line" d="M704 260H746" marker-end="url(#arch-arrow)"/>
