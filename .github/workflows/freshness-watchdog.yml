# Watchdog de frescura — inspecciona el health.json desplegado en producción.
# Si detecta datos rancios o fallos, puede dispatchar recuperación (una sola vez).
name: freshness-watchdog

on:
  schedule:
    - cron: '0 6,12,18,23 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write
  issues: write

concurrency:
  group: enso-production-publication
  cancel-in-progress: false

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Fetch live health manifest and decide
        id: fetch-health
        run: |
          python3 - <<'PYEOF'
          import urllib.request, json, sys, os
          from datetime import datetime, timezone

          url = "https://pillb.github.io/observatorio-enso-peru/data/health.json"
          age_hours = 0
          issues = []

          try:
              resp = urllib.request.urlopen(url, timeout=30)
              h = json.loads(resp.read())
          except Exception as e:
              print(f"ERROR: No se pudo obtener health.json: {e}")
              # If we can't even fetch health, dispatch recovery
              with open(os.environ["GITHUB_ENV"], "a") as f:
                  f.write("dispatch_recovery=true\n")
              sys.exit(0)

          now = datetime.now(timezone.utc)
          gen_at = h.get("generatedAt", "")
          sources = h.get("sources", [])

          print(f"Health manifest fetched:")
          print(f"  pipelineStatus: {h.get('pipelineStatus')}")
          print(f"  generatedAt: {gen_at}")
          print(f"  sources: {len(sources)}")
          print(f"  publicationId: {h.get('publicationId', 'MISSING')}")

          # Check overall freshness
          if gen_at:
              try:
                  gen_dt = datetime.fromisoformat(gen_at.replace("Z", "+00:00"))
                  age_hours = (now - gen_dt).total_seconds() / 3600
                  print(f"  Age: {age_hours:.1f} hours")
                  if age_hours > 30:
                      issues.append(f"Health manifest is {age_hours:.1f}h old (>30h SLO)")
              except Exception:
                  pass

          # Check source-level freshness
          for src in sources:
              sid = src.get("id", "")
              status = src.get("status", "")
              freshness = src.get("freshnessState", "")
              if status == "FAILED" or freshness in {"PUBLICATION_EXPECTED", "DELAYED", "STALE", "FAILED", "QUARANTINED"}:
                  issues.append(f"Source {sid} is {status}/{freshness}")

          # Decide whether to dispatch recovery
          dispatch = "false"
          if issues:
              print("\n⚠ Issues detected:")
              for i in issues:
                  print(f"  - {i}")
              dispatch = "true"
              print("→ Dispatching one bounded recovery attempt")
          else:
              print("\n✅ All sources healthy")

          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"dispatch_recovery={dispatch}\n")
          PYEOF

      - name: Dispatch recovery (if needed and authorized)
        if: env.dispatch_recovery == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            // Only dispatch if no equivalent run is active
            const runs = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'daily-refresh.yml',
              status: 'in_progress',
              per_page: 1
            });
            if (runs.data.workflow_runs.length > 0) {
              core.info('Recovery skipped: daily-refresh already in progress');
              return;
            }
            // Check recent failures (last 3 runs)
            const recent = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'daily-refresh.yml',
              per_page: 3
            });
            const recentFailures = recent.data.workflow_runs.filter(r => r.conclusion === 'failure');
            if (recentFailures.length >= 3) {
              const title = 'ENSO production recovery budget exhausted';
              const body = `Three or more recent daily-refresh runs failed. Manual intervention is required.\n\nWatchdog run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
              const issues = await github.rest.issues.listForRepo({
                owner: context.repo.owner, repo: context.repo.repo,
                state: 'open', per_page: 100
              });
              const existing = issues.data.find(issue => issue.title === title);
              if (existing) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: existing.number, body
                });
              } else {
                await github.rest.issues.create({
                  owner: context.repo.owner, repo: context.repo.repo, title, body
                });
              }
              core.setFailed('3+ consecutive failures — manual intervention required');
              return;
            }
            // Dispatch recovery
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'daily-refresh.yml',
              ref: 'main',
              inputs: {
                force_refresh: 'true',
                dry_run: 'false',
                source: '',
                publication_mode: 'normal'
              }
            });
            core.info('Recovery dispatched: daily-refresh with force_refresh=true');
