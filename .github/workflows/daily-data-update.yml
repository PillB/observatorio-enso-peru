# Alias manual conservado por compatibilidad. Toda ejecución usa el único
# flujo productivo de adquisición, validación y Pages.
name: daily-data-update

on:
  workflow_dispatch:
    inputs:
      force_refresh:
        description: 'Forzar consulta de fuentes'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']
      dry_run:
        description: 'Ejecución de prueba (no publica)'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']
      source:
        description: 'Fuente específica (vacío = todas)'
        required: false
        default: ''
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  refresh:
    uses: ./.github/workflows/_refresh-build-deploy.yml
    with:
      force_refresh: ${{ github.event.inputs.force_refresh == 'true' }}
      dry_run: ${{ github.event.inputs.dry_run == 'true' }}
      source: ${{ github.event.inputs.source || '' }}
      publication_mode: normal
