# Sondea los feeds candidatos (medios regionales, radios, entidades del
# Estado, búsquedas por departamento) desde GitHub Actions y guarda el
# informe y los feeds que funcionan como fixtures, para decidir cuáles entran
# al catálogo y probar el lector con sus formatos reales.
name: probe-feeds

on:
  workflow_dispatch:
  push:
    branches: ['claude/**']
    paths:
      - 'python/tools/probe_feeds.py'
      - 'python/tools/feed_candidates.json'
      - '.github/workflows/probe-feeds.yml'

permissions:
  contents: write

concurrency:
  group: probe-feeds-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -r python/requirements.txt
      - name: Probe
        working-directory: python
        run: python -m tools.probe_feeds --out tests/fixtures/news-probe
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A python/tests/fixtures/news-probe
          git diff --cached --quiet && exit 0
          git commit -m "chore(fixtures): probe candidate news feeds"
          for i in 1 2 3; do
            git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && exit 0
            sleep $((i * 5))
          done
          exit 1
