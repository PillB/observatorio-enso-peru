# Despliegue del frontend estático del Observatorio ENSO Perú en GitHub Pages.
#
# El frontend estático (public/index.html) carga datos desde /data/*.json
# y renderiza el dashboard client-side con vanilla JS. No requiere build.
name: deploy-pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '11 4 * * 1'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
