# Despliegue del frontend estático del Observatorio ENSO Perú en GitHub Pages.
#
# Nota: en este repositorio el frontend es Next.js 16 (App Router). Para un
# despliegue 100% estático en GitHub Pages se requiere `output: 'export'`
# en next.config.ts y configurar `basePath` al nombre del repositorio.
# Esta workflow:
#   1. Instala dependencias con Bun/Node.
#   2. Construye el sitio estático (o copia public/ como respaldo).
#   3. Sube el artefacto y lo publica en GitHub Pages.
# No hardcodea secrets: usa GITHUB_TOKEN automáticamente provisto por Actions.
name: deploy-pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Semanal, los lunes 04:11 UTC (después del pipeline diario).
    - cron: '11 4 * * 1'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile || npm install

      - name: Build static site
        env:
          # Para Pages se requiere basePath = /<repo> si el repo no es <user>.github.io
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
        run: |
          # Intenta export estático; si next.config no lo permite, copia public/.
          bun run build || true
          # Asegura un directorio de publicación.
          mkdir -p ./public_to_publish
          cp -r public/* ./public_to_publish/ 2>/dev/null || true
          # Si el export estático funcionó, usa .next/standalone o out/.
          if [ -d "./out" ]; then
            cp -r ./out/* ./public_to_publish/
          fi
          # Añade .nojekyll para evitar procesamiento Jekyll.
          touch ./public_to_publish/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public_to_publish

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
