# Despliegue por cambios de código. Usa exactamente la misma adquisición,
# validación, construcción y publicación atómica que la actualización diaria.
# Nunca vuelve a publicar el snapshot de public/data/ incluido en el checkout.
name: deploy-pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  refresh-build-deploy:
    uses: ./.github/workflows/_refresh-build-deploy.yml
    with:
      force_refresh: false
      dry_run: false
      source: ''
      publication_mode: normal
