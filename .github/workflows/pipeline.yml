# Pipeline del Observatorio ENSO Perú — adquisición, normalización y tests.
# Validación del pipeline heredado únicamente en pull requests. La producción
# diaria pertenece exclusivamente a daily-refresh.yml.
name: pipeline

on:
  pull_request:
    paths:
      - 'python/**'
      - '.github/workflows/pipeline.yml'

permissions:
  contents: read

concurrency:
  group: enso-pr-pipeline-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: python/requirements.txt

      - name: Install dependencies
        working-directory: python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run contract tests
        working-directory: python
        run: |
          python -m pytest -q

      - name: Validate canonical publication artifacts
        working-directory: python
        env:
          ENSO_DATA_DIR: ../public/data
        run: |
          python -m enso.publication_validator

      - name: Upload pipeline artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: enso-pipeline-out
          path: |
            public/data/**
          if-no-files-found: warn
          retention-days: 30
