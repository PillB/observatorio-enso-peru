# Actualización diaria, validación y despliegue atómico del observatorio.
#
# Un solo flujo publica el sitio: cada noche a las 23:37 hora de Lima
# (04:37 UTC; Perú no tiene horario de verano), al fusionar en main, a
# pedido del vigilante o manualmente. Si el pipeline o las pruebas fallan,
# el sitio anterior sigue publicado. Después de desplegar, comprueba que
# el sitio en vivo sirve la nueva publicación y sincroniza las incidencias
# con issues de GitHub.
#
# Destino del sitio (variables del repositorio, ver docs/despliegue-cloudflare.md):
#   DEPLOY_TARGET       github-pages (por omisión) o cloudflare
#   CLOUDFLARE_PROJECT  nombre del proyecto de Cloudflare Pages (observatorio-enso)
#   SITE_URL            dirección pública; con Cloudflare se deduce del proyecto
# Con Cloudflare, el sitio publicado no enlaza al repositorio de GitHub.
name: observatory

on:
  schedule:
    - cron: '37 4 * * *'
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:
    inputs:
      archive_save:
        description: 'Pedir una copia nueva al Internet Archive cuando una fuente no responda'
        type: boolean
        default: true
  repository_dispatch:
    types: [enso-refresh]

permissions:
  contents: read

concurrency:
  group: enso-production-publication
  cancel-in-progress: false

env:
  DEPLOY_TARGET: ${{ vars.DEPLOY_TARGET || 'github-pages' }}
  CF_PROJECT: ${{ vars.CLOUDFLARE_PROJECT || 'observatorio-enso' }}
  SITE_URL: ${{ vars.SITE_URL || 'https://pillb.github.io/observatorio-enso-peru/' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      publication_id: ${{ steps.pipeline.outputs.publication_id }}
      worst: ${{ steps.pipeline.outputs.worst }}
      site_url: ${{ steps.site.outputs.url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: python/requirements*.txt
      - run: pip install -r python/requirements-dev.txt

      # Con Cloudflare, la dirección sale del proyecto (se crea si falta),
      # salvo que la variable SITE_URL fije otra (p. ej. un dominio propio).
      - name: Resolve the public address
        id: site
        working-directory: python
        env:
          SITE_URL_VAR: ${{ vars.SITE_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          url="$SITE_URL"
          if [ "$DEPLOY_TARGET" = cloudflare ]; then
            if [ -z "$SITE_URL_VAR" ]; then
              url=$(python -m tools.cloudflare_pages --project "$CF_PROJECT")
              echo "::notice::Sitio en $url. Guarde esa dirección en la variable SITE_URL para que el vigilante la revise."
            fi
            # Las fuentes ven la dirección del sitio como contacto, no el repositorio.
            echo "ENSO_CONTACT_URL=${url%/}/" >> "$GITHUB_ENV"
          elif [ "$DEPLOY_TARGET" != github-pages ]; then
            echo "::error::DEPLOY_TARGET debe ser github-pages o cloudflare (es «$DEPLOY_TARGET»)"; exit 1
          fi
          url="${url%/}/"
          echo "SITE_URL=$url" >> "$GITHUB_ENV"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Unit and backtest suite
        working-directory: python
        run: python -m pytest -q -m "not browser"

      # Copias que el recolector del Perú (python/tools/peru_collector.py)
      # sube a la rama data-peru. Si la rama no existe, la carpeta tampoco y
      # el pipeline lo registra como incidencia (relay-missing): sin ella, lo
      # geobloqueado solo llega por réplicas y archivo.
      - name: Fetch the Peru relay copies
        id: relay
        continue-on-error: true
        run: |
          echo "dir=$RUNNER_TEMP/relay" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --heads origin data-peru >/dev/null; then
            git fetch --depth 1 origin data-peru
            git worktree add --detach "$RUNNER_TEMP/relay" FETCH_HEAD
          else
            echo "::warning::La rama data-peru no existe: sin copias desde el Perú."
          fi

      # Copias que el flujo de n8n (n8n/, docs/n8n.md) sube a la rama data-n8n:
      # un segundo canal fuera de Actions para las fuentes no geobloqueadas.
      - name: Fetch the n8n relay copies
        id: n8n
        continue-on-error: true
        run: |
          echo "dir=$RUNNER_TEMP/n8n" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --heads origin data-n8n >/dev/null; then
            git fetch --depth 1 origin data-n8n
            git worktree add --detach "$RUNNER_TEMP/n8n" FETCH_HEAD
          else
            echo "::warning::La rama data-n8n no existe: sin copias de n8n."
          fi

      # Si la publicación anterior no trae el histórico de noticias (sitio
      # caído, primer despliegue en otro hosting), se rehace con las notas que
      # cada corrida guarda en la rama data-archive (sources/news/<día>.jsonl).
      - name: News history backup (only if the live copy is unreachable)
        id: history
        continue-on-error: true
        run: |
          if curl -fsS --max-time 60 -o /dev/null "${SITE_URL}data/news/items.jsonl"; then
            echo "El histórico publicado responde: no hace falta la copia."
          elif git ls-remote --exit-code --heads origin data-archive >/dev/null; then
            git fetch --depth 1 origin data-archive
            mkdir -p "$RUNNER_TEMP/history"
            git archive FETCH_HEAD sources/news | tar -x -C "$RUNNER_TEMP/history" --strip-components=2 \
              && echo "dir=$RUNNER_TEMP/history" >> "$GITHUB_OUTPUT"
            ls "$RUNNER_TEMP/history" | tail -3
          fi

      - name: Fetch, validate and build the publication
        id: pipeline
        working-directory: python
        env:
          ENSO_ARCHIVE_SAVE: ${{ (github.event_name != 'workflow_dispatch' || inputs.archive_save) && '1' || '0' }}
          RELAY_DIR: ${{ steps.relay.outputs.dir }}
          N8N_DIR: ${{ steps.n8n.outputs.dir }}
          HISTORY_DIR: ${{ steps.history.outputs.dir }}
        run: |
          python -m enso.observatory \
            --out ../public/data \
            --previous "${SITE_URL}data" \
            --raw-dir "$RUNNER_TEMP/raw" \
            ${RELAY_DIR:+--relay-dir "$RELAY_DIR"} \
            ${N8N_DIR:+--n8n-dir "$N8N_DIR"} \
            ${HISTORY_DIR:+--history-dir "$HISTORY_DIR"} \
            --fail-on critical

      - name: Adapt the site to its public address
        working-directory: python
        run: python -m tools.prepare_site --site-dir ../public --site-url "$SITE_URL" ${{ env.DEPLOY_TARGET == 'cloudflare' && '--hide-repo --cloudflare' || '' }}

      - name: Browser checks against the built site
        working-directory: python
        run: |
          python -m playwright install --with-deps chromium
          python -m pytest -q -m browser --site-dir=../public

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: run-report
          path: |
            public/data/run-report.json
            public/data/sources.json
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: raw-sources
          path: ${{ runner.temp }}/raw
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/configure-pages@v5
        if: env.DEPLOY_TARGET == 'github-pages'
      - uses: actions/upload-pages-artifact@v3
        if: env.DEPLOY_TARGET == 'github-pages'
        with:
          path: public
      - uses: actions/upload-artifact@v4
        if: env.DEPLOY_TARGET == 'cloudflare'
        with:
          name: site
          path: public
          retention-days: 3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: ${{ vars.DEPLOY_TARGET == 'cloudflare' && 'cloudflare-pages' || 'github-pages' }}
      url: ${{ needs.build.outputs.site_url }}
    env:
      SITE_URL: ${{ needs.build.outputs.site_url }}
    steps:
      - id: deploy
        if: env.DEPLOY_TARGET == 'github-pages'
        uses: actions/deploy-pages@v4
      # functions/ y wrangler.toml (si existen) viajan con la subida directa:
      # wrangler los toma del directorio de trabajo (Pages Functions y sus
      # vínculos D1/KV). El modo cono incluye siempre los archivos de la raíz.
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            python
            functions
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install httpx
      - name: Make sure the Cloudflare Pages project exists
        id: cf
        if: env.DEPLOY_TARGET == 'cloudflare'
        working-directory: python
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python -m tools.cloudflare_pages --project "$CF_PROJECT"
      - uses: actions/download-artifact@v4
        if: env.DEPLOY_TARGET == 'cloudflare'
        with:
          name: site
          path: public
      # Sin gitHubToken: no se crean «deployments» de GitHub que enlacen el
      # repositorio con el sitio. Se despliega a la rama de producción del
      # proyecto: otra rama quedaría como vista previa.
      - name: Deploy to Cloudflare Pages
        if: env.DEPLOY_TARGET == 'cloudflare'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=${{ env.CF_PROJECT }} --branch=${{ steps.cf.outputs.branch }} --commit-message="publicación ${{ needs.build.outputs.publication_id }}" --commit-dirty=true
      - name: Verify the live site serves this publication
        working-directory: python
        run: python -m tools.verify_live --base "$SITE_URL" --expect "${{ needs.build.outputs.publication_id }}"

  incidents:
    # Corre siempre que el build haya llegado a producir un informe.
    needs: [build, deploy]
    if: always() && needs.build.result != 'skipped' && github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: python
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install httpx
      - uses: actions/download-artifact@v4
        with:
          name: run-report
          path: report
        continue-on-error: true
      - name: Sync incidents with issues
        working-directory: python
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -f ../report/run-report.json ]; then
            python -m tools.sync_issues --report ../report/run-report.json --run-url "$RUN_URL"
          fi
      - name: Open an issue when the run itself failed
        if: needs.build.result == 'failure' || needs.deploy.result == 'failure'
        uses: actions/github-script@v8
        with:
          script: |
            const title = '[datos] La actualización diaria falló';
            const { data: open } = await github.rest.issues.listForRepo({ ...context.repo, state: 'open', labels: 'incidente-datos', per_page: 100 });
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `La corrida ${url} terminó con error (build: ${{ needs.build.result }}, despliegue: ${{ needs.deploy.result }}). El sitio publicado sigue mostrando la publicación anterior.\n\n<!-- enso-fp:run-failed -->`;
            const prev = open.find(i => (i.body || '').includes('enso-fp:run-failed'));
            if (prev) await github.rest.issues.createComment({ ...context.repo, issue_number: prev.number, body: `Volvió a fallar: ${url}` });
            else await github.rest.issues.create({ ...context.repo, title, body, labels: ['incidente-datos'] });
      - name: Close the run-failure issue after a good run
        if: needs.build.result == 'success' && needs.deploy.result == 'success'
        uses: actions/github-script@v8
        with:
          script: |
            const { data: open } = await github.rest.issues.listForRepo({ ...context.repo, state: 'open', labels: 'incidente-datos', per_page: 100 });
            for (const i of open.filter(i => (i.body || '').includes('enso-fp:run-failed'))) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: i.number, body: 'La actualización volvió a funcionar. Se cierra automáticamente.' });
              await github.rest.issues.update({ ...context.repo, issue_number: i.number, state: 'closed', state_reason: 'completed' });
            }

  archive:
    # Corpus de respuestas originales para backtesting de los lectores.
    needs: build
    if: success() && github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: raw-sources
          path: raw
        continue-on-error: true
      - name: Commit new raw responses to the data-archive branch
        run: |
          [ -d raw ] || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin data-archive >/dev/null; then
            git fetch --depth 1 origin data-archive
            git worktree add ../archive FETCH_HEAD
            git -C ../archive switch -c data-archive
          else
            git worktree add --detach ../archive
            git -C ../archive switch --orphan data-archive
          fi
          mkdir -p ../archive/sources
          cp -rn raw/. ../archive/sources/
          cd ../archive
          git add sources
          git diff --cached --quiet && exit 0
          git commit -q -m "archive: raw source responses $(date -u +%F)"
          git push origin data-archive

  keepalive:
    # GitHub desactiva los flujos programados tras 60 días sin actividad en
    # el repositorio. Reactivarlos por API reinicia ese plazo.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - uses: actions/github-script@v8
        with:
          script: |
            for (const id of ['observatory.yml', 'watchdog.yml', 'probe-sources.yml']) {
              try { await github.rest.actions.enableWorkflow({ ...context.repo, workflow_id: id }); core.info(`enabled ${id}`); }
              catch (e) { core.warning(`${id}: ${e.message}`); }
            }
