# Pruebas en cada pull request: lectores contra copias históricas de las
# fuentes, pipeline completo sin red (fixtures) y recorridos de usuario en
# el navegador sobre el sitio construido con esos datos. A mano en una rama:
# memoria-cosecha.yml lo lanza en el PR que abre (un PR abierto por Actions no
# lanza flujos solo).
name: ci

on:
  pull_request:
  push:
    branches: ['claude/**']
    paths-ignore: ['python/tests/fixtures/sources/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # Pruebas ~7 min + navegador en tres motores ~18 min desde los recorridos guiados (#70); 25 ya no alcanzaba.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: python/requirements*.txt
      - run: pip install -r python/requirements-dev.txt
      # Node 22 (node:sqlite) para las pruebas de la consola de lugares (functions/).
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Parsers, backtests and pipeline
        working-directory: python
        run: python -m pytest -q -m "not browser"
      - name: Build the site from captured sources (offline)
        working-directory: python
        run: python -m enso.observatory --out ../public/data --previous '' --fixtures tests/fixtures/sources --fail-on critical
      # En la imagen oficial de Playwright, que ya trae los tres navegadores y sus
      # bibliotecas: «playwright install --with-deps» las bajaba por apt y el espejo
      # azure.archive.ubuntu.com se quedaba en pocos kB/s hasta agotar el tiempo del
      # job antes de la primera prueba (#49, #55, #56, #58; 26 de octubre). La
      # etiqueta sale de la versión de Playwright que pip acaba de instalar, así que
      # Dependabot no tiene que subirla aparte. Node 22 entra desde setup-node.
      - name: Browser journeys (Chromium, WebKit, Firefox in the Playwright image)
        run: |
          pw=$(python -c 'import importlib.metadata as m; print(m.version("playwright"))')
          node_dir=$(dirname "$(dirname "$(readlink -f "$(command -v node)")")")
          docker run --rm --ipc=host -e CI \
            -v "$node_dir:/opt/node:ro" -e PATH="/opt/node/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin" \
            -v "$GITHUB_WORKSPACE:/w" -w /w/python "mcr.microsoft.com/playwright/python:v$pw-noble" \
            bash -c "pip install -q --root-user-action=ignore -r requirements-dev.txt 'playwright==$pw' && python -m pytest -q -m browser --site-dir=../public"
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-screenshots
          path: python/test-results
          if-no-files-found: ignore
