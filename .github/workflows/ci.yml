# Pruebas en cada pull request: lectores contra copias históricas de las
# fuentes, pipeline completo sin red (fixtures) y recorridos de usuario en
# el navegador sobre el sitio construido con esos datos.
name: ci

on:
  pull_request:
  push:
    branches: ['claude/**']
    paths-ignore: ['python/tests/fixtures/sources/**']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: python/requirements*.txt
      - run: pip install -r python/requirements-dev.txt
      - name: Parsers, backtests and pipeline
        working-directory: python
        run: python -m pytest -q -m "not browser"
      - name: Build the site from captured sources (offline)
        working-directory: python
        run: python -m enso.observatory --out ../public/data --previous '' --fixtures tests/fixtures/sources --fail-on critical
      - name: Browser journeys (Chromium, phone and desktop)
        working-directory: python
        run: |
          python -m playwright install --with-deps chromium
          python -m pytest -q -m browser --site-dir=../public
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-screenshots
          path: python/test-results
          if-no-files-found: ignore
