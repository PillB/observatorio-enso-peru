# Pruebas en cada pull request: lectores contra copias históricas de las
# fuentes, pipeline completo sin red (fixtures) y recorridos de usuario en
# el navegador sobre el sitio construido con esos datos. A mano en una rama:
# memoria-cosecha.yml lo lanza en el PR que abre (un PR abierto por Actions no
# lanza flujos solo).
name: ci

on:
  pull_request:
  push:
    branches: ['claude/**']
    paths-ignore: ['python/tests/fixtures/sources/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # chore(lint): techo de complejidad ciclomática (10, NIST SP 500-235) de todo el Python y el JavaScript, con la
  # lista de excepciones que solo puede bajar (docs/complejidad.md). Rápido y aparte, para que su error se vea solo.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: scripts/lint/package-lock.json
      # El recolector del Perú se instala con Python 3.11 o más (collector/instalar.sh, docs/servidor-peru.md):
      # una sintaxis de 3.12 (comillas iguales dentro de un f-string) rompió hazardparse.py en 3.11 desde el
      # 26-10-2026 sin que nada lo notara. Se compila todo con 3.11 para que lo declarado se compruebe.
      - uses: actions/setup-python@v7
        id: py311
        with:
          python-version: '3.11'
          update-environment: false
      - name: The pipeline still compiles on Python 3.11 (the collector's declared minimum)
        run: ${{ steps.py311.outputs.python-path }} -m compileall -q -x 'tests/fixtures' python/enso python/tools python/tests
      - name: ESLint and pytest (versions pinned in scripts/lint/package-lock.json and requirements-dev.txt)
        run: |
          npm ci --prefix scripts/lint --ignore-scripts --no-audit --no-fund
          grep -E '^(pytest|radon)\b' python/requirements-dev.txt > "$RUNNER_TEMP/lint-req.txt"
          pip install -r "$RUNNER_TEMP/lint-req.txt"
      - name: Cyclomatic complexity ceiling (ratchet)
        working-directory: python
        run: python -m tools.complexity --report 15
      - name: The complexity check itself (hand-counted CFGs, radon cross-check, ratchet mutations)
        working-directory: python
        env:
          COMPLEXITY_REQUIRE_JS: '1'
        run: python -m pytest -q tests/test_complexity.py

  test:
    runs-on: ubuntu-latest
    # Pruebas ~7 min + navegador en tres motores ~18 min desde los recorridos guiados (#70); 25 ya no alcanzaba.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: python/requirements*.txt
      - run: pip install -r python/requirements-dev.txt
      # Node 22 (node:sqlite) para las pruebas de la consola de lugares (functions/).
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Parsers, backtests and pipeline
        working-directory: python
        run: python -m pytest -q -m "not browser"
      - name: Build the site from captured sources (offline)
        working-directory: python
        run: python -m enso.observatory --out ../public/data --previous '' --fixtures tests/fixtures/sources --fail-on critical
      # En la imagen oficial de Playwright, que ya trae los tres navegadores y sus
      # bibliotecas: «playwright install --with-deps» las bajaba por apt y el espejo
      # azure.archive.ubuntu.com se quedaba en pocos kB/s hasta agotar el tiempo del
      # job antes de la primera prueba (#49, #55, #56, #58; 26 de octubre). La
      # etiqueta sale de la versión de Playwright que pip acaba de instalar, así que
      # Dependabot no tiene que subirla aparte. Node 22 entra desde setup-node.
      # PyPI publica una versión nueva antes que su imagen (1.65.0, 10 de noviembre):
      # si la imagen de esa versión todavía no existe, se usa la versión anterior más
      # nueva que sí la tiene, y el contenedor instala esa misma versión de Playwright.
      - name: Browser journeys (Chromium, WebKit, Firefox in the Playwright image)
        run: |
          pw=$(python -c 'import importlib.metadata as m; print(m.version("playwright"))')
          if ! docker manifest inspect "mcr.microsoft.com/playwright/python:v$pw-noble" > /dev/null 2>&1; then
            for v in $(pip index versions playwright 2>/dev/null | sed -n 's/^Available versions: //p' | tr -d ',' | tr ' ' '\n' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$'); do
              if [ "$(printf '%s\n%s\n' "$v" "$pw" | sort -V | head -1)" = "$v" ] && [ "$v" != "$pw" ] \
                && docker manifest inspect "mcr.microsoft.com/playwright/python:v$v-noble" > /dev/null 2>&1; then
                echo "::warning::No Playwright image for $pw yet; using $v"
                pw=$v
                break
              fi
            done
          fi
          node_dir=$(dirname "$(dirname "$(readlink -f "$(command -v node)")")")
          docker run --rm --ipc=host -e CI \
            -v "$node_dir:/opt/node:ro" -e PATH="/opt/node/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin" \
            -v "$GITHUB_WORKSPACE:/w" -w /w/python "mcr.microsoft.com/playwright/python:v$pw-noble" \
            bash -c "pip install -q --root-user-action=ignore -r requirements-dev.txt 'playwright==$pw' && python -m pytest -q -m browser --site-dir=../public"
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-screenshots
          path: python/test-results
          if-no-files-found: ignore
