# Implementación compartida de actualización de datos.
# Reutilizada por daily-data-update.yml y freshness-watchdog.yml.
name: _update-data

on:
  workflow_call:
    inputs:
      force_refresh:
        description: 'Forzar actualización'
        required: false
        default: false
        type: boolean
      dry_run:
        description: 'Ejecución de prueba'
        required: false
        default: false
        type: boolean
      source:
        description: 'Fuente específica'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: python/requirements.txt

      - name: Install dependencies
        run: pip install -r python/requirements.txt

      - name: Run pipeline
        run: |
          cd python
          ARGS="--offline"
          if [ "${{ inputs.force_refresh }}" = "true" ]; then
            ARGS="$ARGS --force"
          fi
          if [ -n "${{ inputs.source }}" ]; then
            ARGS="$ARGS --source ${{ inputs.source }}"
          fi
          python -m enso.cli run $ARGS || true
          python -m enso.cli validate || true

      - name: Generate health and required data
        run: python3 scripts/gen-health-and-required-data.py

      - name: Run tests
        run: |
          cd python
          python -m pytest -q
