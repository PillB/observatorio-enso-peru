# Vigilante independiente: cada 6 horas (minuto 17) lee el sitio en vivo.
# Si la publicación tiene más de 30 horas, reactiva y relanza el flujo
# diario una vez y abre un issue. Si el flujo diario estaba desactivado
# por inactividad, lo reactiva. También lee el latido (heartbeat.json) de
# las ramas data-peru y data-n8n: si un recolector lleva más de 36 horas
# callado, abre un issue aunque el flujo diario esté fallando. Si la
# sonda semanal (probe-sources.yml) no terminó bien en main en 8 días, la
# relanza. La lógica está en .github/scripts/watchdog.cjs.
name: watchdog

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: enso-watchdog
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      issues: write
      contents: read  # heartbeat.json de data-peru y data-n8n
    steps:
      - name: Note when the job started (for the alert email)
        run: echo "ALERT_SINCE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      # Solo el módulo del vigilante (el modo cono trae también los archivos de la raíz).
      - uses: actions/checkout@v5
        with:
          sparse-checkout: .github/scripts
      - uses: actions/github-script@v8
        env:
          SITE_URL: ${{ vars.SITE_URL || (vars.DEPLOY_TARGET != 'cloudflare' && 'https://pillb.github.io/observatorio-enso-peru/' || '') }}
          MAX_AGE_HOURS: '30'
        with:
          script: |
            const { run } = require('./.github/scripts/watchdog.cjs');
            await run({ github, context, core });
      # Correo a las direcciones de ALERT_EMAILS si el vigilante abrió o cerró sus issues, o comentó el del sitio
      # atrasado o el recordatorio diario de un recolector callado (ver tools/alert_email.py).
      - uses: actions/checkout@v5
        if: always() && vars.ALERT_EMAILS != ''
        with:
          sparse-checkout: python
      - uses: actions/setup-python@v6
        if: always() && vars.ALERT_EMAILS != ''
        with:
          python-version: '3.12'
      - name: Email the configured addresses
        if: always() && vars.ALERT_EMAILS != ''
        working-directory: python
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ALERT_EMAILS: ${{ vars.ALERT_EMAILS }}
          ALERT_FROM: ${{ vars.ALERT_FROM }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: |
          pip install -q httpx
          python -m tools.alert_email --since "$ALERT_SINCE" --run-url "$RUN_URL"
