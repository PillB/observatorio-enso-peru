# Validación de pull requests del Observatorio ENSO Perú.
name: pull-request-validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: python/requirements.txt

      - name: Install dependencies
        run: pip install -r python/requirements.txt

      - name: Run pytest
        run: |
          cd python
          python -m pytest -q

      - name: Check for hardcoded values
        run: |
          # Scan for hardcoded observations in production code
          if grep -rE "valor.*=.*[0-9]+\.[0-9]+" public/index.html --include="*.html" | grep -v "var\|const\|let\|function\|return\|\.toFixed\|Math\." | head -5; then
            echo "::warning::Posibles valores hardcodeados detectados"
          else
            echo "No hardcoded values detected"
          fi

      - name: Check for secrets
        run: |
          if grep -rE "sk-[a-zA-Z0-9]{20}|ghp_[a-zA-Z0-9]{30}|AKIA[A-Z0-9]{16}" public/ src/ --include="*.ts" --include="*.tsx" --include="*.html" --include="*.json" | head -5; then
            echo "::error::Posibles secretos detectados"
            exit 1
          else
            echo "No secrets detected"
          fi
