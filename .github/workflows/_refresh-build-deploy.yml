# Flujo de trabajo reutilizable para actualización, build y despliegue atómico.
# Usado por: daily-refresh.yml, manual dispatch, repository_dispatch, watchdog recovery.
# Concurrency group único: enso-production-publication (evita races entre workflows).
name: _refresh-build-deploy

on:
  workflow_call:
    inputs:
      force_refresh:
        description: 'Forzar actualización ignorando caché condicional'
        required: false
        default: false
        type: boolean
      dry_run:
        description: 'Ejecución de prueba (no publica)'
        required: false
        default: false
        type: boolean
      source:
        description: 'Fuente específica (vacío = todas)'
        required: false
        default: ''
        type: string
      publication_mode:
        description: 'Modo de publicación (normal|staging_only)'
        required: false
        default: 'normal'
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: enso-production-publication
  cancel-in-progress: false

jobs:
  refresh-build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: python/requirements.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r python/requirements.txt
          pip install httpx beautifulsoup4

      - name: Run unified acquisition
        id: acquire
        env:
          ENSO_FORCE_REFRESH: ${{ inputs.force_refresh }}
          ENSO_DRY_RUN: ${{ inputs.dry_run }}
          ENSO_SOURCE: ${{ inputs.source }}
        run: |
          cd python
          args=(--staging-dir ../staging --publication-dir ../public/data)
          if [ "$ENSO_FORCE_REFRESH" = "true" ]; then
            args+=(--force-refresh)
          fi
          if [ -n "$ENSO_SOURCE" ]; then
            args+=(--source "$ENSO_SOURCE")
          fi
          if [ "$ENSO_DRY_RUN" = "true" ]; then
            args+=(--dry-run)
          fi
          python -m enso.unified_acquisition "${args[@]}"
          echo "acquisition_exit=$?" >> $GITHUB_OUTPUT

      - name: Run scientific tests
        run: |
          cd python
          python -m pytest -q --tb=short

      - name: Validate publication coherence
        working-directory: python
        env:
          ENSO_DATA_DIR: ${{ inputs.dry_run && '../staging' || '../public/data' }}
        run: python -m enso.publication_validator

      - name: Setup Pages
        if: inputs.dry_run != true && inputs.publication_mode != 'staging_only'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: inputs.dry_run != true && inputs.publication_mode != 'staging_only'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Deploy to GitHub Pages
        id: deploy
        if: inputs.dry_run != true && inputs.publication_mode != 'staging_only'
        uses: actions/deploy-pages@v4

      - name: Verify live deployment
        if: inputs.dry_run != true && inputs.publication_mode != 'staging_only'
        env:
          EXPECTED_PUBLICATION_ID: ${{ steps.acquire.outputs.publication_id }}
        run: |
          python3 - <<'PYEOF'
          import urllib.request, json, sys, time
          expected = json.load(open("public/data/health.json"))["publicationId"]
          url = "https://pillb.github.io/observatorio-enso-peru/data/health.json"
          last = None
          for attempt in range(12):
              try:
                  req = urllib.request.Request(url + f"?verify={time.time_ns()}", headers={"Cache-Control":"no-cache"})
                  h = json.loads(urllib.request.urlopen(req, timeout=30).read())
                  last = h.get("publicationId")
                  if last == expected:
                      print(f"✅ Live publication verified: {expected}")
                      sys.exit(0)
              except Exception as exc:
                  print(f"Attempt {attempt + 1}: {exc}")
              time.sleep(10)
          print(f"❌ Live publication mismatch: expected={expected}, observed={last}")
          sys.exit(1)
          PYEOF
