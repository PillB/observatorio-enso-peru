# Flujo de trabajo reutilizable para actualización, build y despliegue atómico.
# Usado por: daily-refresh.yml, manual dispatch, repository_dispatch, watchdog recovery.
# Concurrency group único: enso-production-publication (evita races entre workflows).
name: _refresh-build-deploy

on:
  workflow_call:
    inputs:
      force_refresh:
        description: 'Forzar actualización ignorando caché condicional'
        required: false
        default: false
        type: boolean
      dry_run:
        description: 'Ejecución de prueba (no publica)'
        required: false
        default: false
        type: boolean
      source:
        description: 'Fuente específica (vacío = todas)'
        required: false
        default: ''
        type: string
      publication_mode:
        description: 'Modo de publicación (normal|staging_only)'
        required: false
        default: 'normal'
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: enso-production-publication
  cancel-in-progress: false

jobs:
  refresh-build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: python/requirements.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r python/requirements.txt
          pip install httpx beautifulsoup4

      - name: Run unified acquisition
        id: acquire
        run: |
          cd python
          ARGS=""
          if [ "${{ inputs.force_refresh }}" = "true" ]; then
            ARGS="$ARGS --force-refresh"
          fi
          if [ -n "${{ inputs.source }}" ]; then
            ARGS="$ARGS --source ${{ inputs.source }}"
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          python -m enso.unified_acquisition --staging-dir ../staging --publication-dir ../public/data $ARGS
          echo "acquisition_exit=$?" >> $GITHUB_OUTPUT

      - name: Run scientific tests
        run: |
          cd python
          python -m pytest -q --tb=short

      - name: Validate publication coherence
        run: |
          python3 - <<'PYEOF'
          import json, sys
          from pathlib import Path
          pub = Path("public/data")
          errors = []

          # Check all required files exist
          required = ["status.json", "health.json", "manifest.json", "nino12.csv", "nino34.csv", "roni.csv", "soi.csv", "d20.csv", "u850.csv"]
          for f in required:
              if not (pub / f).exists():
                  errors.append(f"Missing required file: {f}")

          # Check status.json has publication ID
          if (pub / "status.json").exists():
              s = json.loads((pub / "status.json").read_text())
              if not s.get("publicationId"):
                  errors.append("status.json missing publicationId")
              if s.get("dataSource") != "LIVE_OBSERVED":
                  errors.append(f"status.json dataSource is {s.get('dataSource')}, expected LIVE_OBSERVED")
              # RONI must NOT be computed as rolling mean
              if "roniSource" not in s.get("basin", {}):
                  errors.append("status.json missing roniSource field")
              elif "computed" in s["basin"]["roniSource"].lower() and "NOT computed" not in s["basin"]["roniSource"]:
                  errors.append("RONI appears to be computed, not official")

          # Check health.json has real evidence
          if (pub / "health.json").exists():
              h = json.loads((pub / "health.json").read_text())
              if not h.get("sources"):
                  errors.append("health.json has no sources")
              for src in h.get("sources", []):
                  if not src.get("retrievalEvidence"):
                      errors.append(f"health.json source {src['id']} has no retrievalEvidence")

          # Check manifest.json
          if (pub / "manifest.json").exists():
              m = json.loads((pub / "manifest.json").read_text())
              if not m.get("publicationId"):
                  errors.append("manifest.json missing publicationId")
              if m.get("dataVersion") != "3.0.0":
                  errors.append(f"manifest.json dataVersion is {m.get('dataVersion')}, expected 3.0.0")

          if errors:
              print("VALIDATION FAILED:")
              for e in errors:
                  print(f"  ❌ {e}")
              sys.exit(1)
          else:
              print("✅ Publication coherence validated")
          PYEOF

      - name: Setup Pages
        if: inputs.dry_run != true && inputs.publication_mode != 'staging_only'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: inputs.dry_run != true && inputs.publication_mode != 'staging_only'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Deploy to GitHub Pages
        id: deploy
        if: inputs.dry_run != true && inputs.publication_mode != 'staging_only'
        uses: actions/deploy-pages@v4

      - name: Verify live deployment
        if: inputs.dry_run != true && inputs.publication_mode != 'staging_only'
        run: |
          sleep 15
          python3 - <<'PYEOF'
          import urllib.request, json, sys
          url = "https://pillb.github.io/observatorio-enso-peru/data/health.json"
          try:
              resp = urllib.request.urlopen(url, timeout=30)
              h = json.loads(resp.read())
              print(f"Live health.json: pipelineStatus={h.get('pipelineStatus')}")
              print(f"  Sources: {len(h.get('sources', []))}")
              print(f"  Publication ID: {h.get('publicationId', 'MISSING')}")
              if h.get("pipelineStatus") != "UPDATED":
                  print("WARNING: pipelineStatus is not UPDATED")
                  sys.exit(1)
              print("✅ Live deployment verified")
          except Exception as e:
              print(f"❌ Live verification failed: {e}")
              sys.exit(1)
          PYEOF
