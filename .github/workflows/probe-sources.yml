# Mide desde GitHub Actions (EE. UU., como n8n en AWS) qué fuentes del
# registro responden, suma lo que bajó el servidor del Perú (rama data-peru,
# si existe) y regenera registry/sources.json: así se decide qué fuentes van
# por servidor-peru (solo las geobloqueadas). Manual y una vez por semana.
name: probe-sources

on:
  workflow_dispatch:
  schedule:
    - cron: '17 9 * * 1'

permissions:
  contents: write

concurrency:
  group: probe-sources-${{ github.ref }}
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: python/requirements*.txt
      - run: pip install -r python/requirements.txt
      - name: Peru relay index (optional)
        run: |
          if git fetch --depth=1 origin data-peru 2>/dev/null; then
            git show FETCH_HEAD:index.json > /tmp/peru-index.json 2>/dev/null || rm -f /tmp/peru-index.json
          fi
          ls -l /tmp/peru-index.json 2>/dev/null || echo "sin índice del Perú todavía"
      - name: Probe and rebuild the registry
        working-directory: python
        run: |
          args=""
          [ -s /tmp/peru-index.json ] && args="--peru-index /tmp/peru-index.json"
          python -m tools.probe_sources $args
          python -m tools.build_registry
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add registry/
          git diff --cached --quiet && exit 0
          git commit -m "Update source reachability and registry"
          # En main el registro medido es el que leen el recolector del Perú y
          # n8n. En otras ramas va a bot/registry/<rama>, nunca a la rama de un PR.
          if [ "$GITHUB_REF_NAME" = "${{ github.event.repository.default_branch }}" ]; then
            for i in 1 2 3; do git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && exit 0; sleep $((i*5)); done
            exit 1
          fi
          git push --force origin "HEAD:refs/heads/bot/registry/$GITHUB_REF_NAME"
          echo "::notice::Resultado en la rama bot/registry/$GITHUB_REF_NAME"
