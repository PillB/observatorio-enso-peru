# Mide desde GitHub Actions (EE. UU., como n8n en AWS) qué fuentes del
# registro responden, suma lo que bajaron el servidor del Perú (rama data-peru)
# y n8n (rama data-n8n), si existen, y regenera registry/sources.json: así se
# decide qué fuentes van por servidor-peru (solo las geobloqueadas) y cuáles
# por n8n. Manual, una vez por semana y, en las ramas claude/**, al cambiar el
# medidor (como los demás sondeos; el resultado va a bot/registry/<rama>).
# El registro va dentro de los flujos de n8n (n8n/dist): se regeneran en el
# mismo commit, o el control «dist/ matches the source» de n8n.yml falla.
# Antes de escribir en main, el registro nuevo pasa las pruebas (la medición
# del 26 de octubre de 2026 dejó main en rojo; .github/scripts/registry-gate.sh),
# otra vez si main cambió mientras se medía; si no, va a bot/registry/main y la
# corrida falla, con un issue «incidente-datos» que se cierra solo con el
# próximo registro que las pasa. Lo que la medición restringe por robots.txt
# llega igual a main, solo eso (tools/registry_restrict.py): n8n pide sin leer
# robots.txt lo que el registro de main da por permitido.
name: probe-sources

on:
  workflow_dispatch:
  schedule:
    - cron: '17 9 * * 1'
  push:
    branches: ['claude/**']
    paths:
      - 'python/tools/probe_sources.py'
      - '.github/workflows/probe-sources.yml'

permissions:
  contents: write
  issues: write  # el issue del registro que no pasa las pruebas

concurrency:
  group: probe-sources-${{ github.ref }}
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: python/requirements*.txt
      - run: pip install -r python/requirements-dev.txt
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Peru relay index (optional)
        run: |
          if git fetch --depth=1 origin data-peru 2>/dev/null; then
            git show FETCH_HEAD:index.json > /tmp/peru-index.json 2>/dev/null || rm -f /tmp/peru-index.json
          fi
          ls -l /tmp/peru-index.json 2>/dev/null || echo "sin índice del Perú todavía"
      - name: n8n relay index (optional)
        run: |
          if git fetch --depth=1 origin data-n8n 2>/dev/null; then
            git show FETCH_HEAD:index.json > /tmp/n8n-index.json 2>/dev/null || rm -f /tmp/n8n-index.json
          fi
          ls -l /tmp/n8n-index.json 2>/dev/null || echo "sin índice de n8n todavía"
      - name: Probe and rebuild the registry
        working-directory: python
        run: |
          args=""
          [ -s /tmp/peru-index.json ] && args="--peru-index /tmp/peru-index.json"
          [ -s /tmp/n8n-index.json ] && args="$args --n8n-index /tmp/n8n-index.json"
          python -m tools.probe_sources $args
          # Un registro medido que no valida lo decide el paso «Test the new registry» (build_registry --check).
          python -m tools.build_registry || echo "::warning::El registro medido no valida: lo decide el paso «Test the new registry»"
      # Sin N8N_GITHUB_CRED_ID: el dist/ del repositorio lleva el id de credencial por omisión (docs/n8n.md).
      - name: Rebuild the n8n flows with the new registry
        run: node n8n/build.mjs
      # Las pruebas que leen el registro y n8n/dist, con lo recién medido (sin navegador: no hace falta).
      - name: Test the new registry
        id: gate
        continue-on-error: true
        run: bash .github/scripts/registry-gate.sh
      - name: Commit
        id: commit
        env:
          GATE: ${{ steps.gate.outcome }}
          # Respaldo por si el evento no trae «repository»: la rama principal es main (la corrida programada del
          # 26 de octubre sí lo trajo y escribió en main).
          MAIN: ${{ github.event.repository.default_branch || 'main' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add registry/ n8n/dist
          git diff --cached --quiet && exit 0
          git commit -m "Update source reachability and registry"
          # Sube HEAD a main sobre lo que tenga ahora. n8n/dist lleva un hash de n8n/ y del registro, y
          # registry/sources.json sale de reachability.json y del código: si cambiaron en main mientras se medía, el
          # rebase choca ahí. No se mezclan: se regeneran sobre lo rebasado (si chocó reachability.json, se aborta).
          # Con «test», si main cambió, lo rebasado no es lo que probó el paso «Test the new registry»: se prueba otra
          # vez y, si no pasa, no se sube (3).
          regenerate() {
            if git diff --name-only --diff-filter=U | grep -qx registry/sources.json; then
              git checkout --theirs -- registry/sources.json  # el medido, sin marcas de conflicto, y se regenera
              (cd python && python -m tools.build_registry) || return 1
            fi
            node n8n/build.mjs && git add registry/sources.json n8n/dist && GIT_EDITOR=true git rebase --continue
          }
          push_main() {
            for i in 1 2 3; do
              if git pull --rebase origin "$GITHUB_REF_NAME" || regenerate; then
                if [ "$1" = test ] && [ "$(git rev-parse HEAD~1)" != "$GITHUB_SHA" ] &&
                   ! bash "${GATE_SCRIPT:-.github/scripts/registry-gate.sh}"; then
                  return 3
                fi
                git push origin "HEAD:$GITHUB_REF_NAME" && return 0
              else
                git rebase --abort || true
              fi
              sleep $((i*5))
            done
            return 1
          }
          on_main=""
          [ "$GITHUB_REF_NAME" = "$MAIN" ] && on_main=1
          if [ "$GATE" != failure ]; then
            if [ -z "$on_main" ]; then
              # En main el registro medido es el que leen el recolector del Perú y n8n. En otras ramas va a
              # bot/registry/<rama>, nunca a la rama de un PR.
              git push --force origin "HEAD:refs/heads/bot/registry/$GITHUB_REF_NAME"
              echo "::notice::Resultado en la rama bot/registry/$GITHUB_REF_NAME"
              exit 0
            fi
            rc=0
            push_main test || rc=$?
            [ "$rc" = 3 ] || exit "$rc"
          fi
          echo "gate=failure" >> "$GITHUB_OUTPUT"
          git push --force origin "HEAD:refs/heads/bot/registry/$GITHUB_REF_NAME"
          echo "::error::El registro nuevo no pasa las pruebas: no se escribe en $GITHUB_REF_NAME. Resultado en bot/registry/$GITHUB_REF_NAME"
          if [ -n "$on_main" ]; then
            # n8n pide sin leer robots.txt lo que el registro de main da por permitido: lo que la medición restringe
            # por robots.txt llega igual a main, y solo eso (tools/registry_restrict.py), aunque no pase las pruebas.
            base="$RUNNER_TEMP/registry-base"
            report="$RUNNER_TEMP/registry-restricted.md"
            mkdir -p "$base"
            git show HEAD~1:registry/sources.json > "$base/sources.json"
            git show HEAD~1:registry/reachability.json > "$base/reachability.json" 2>/dev/null || : > "$base/reachability.json"
            if bash "${RESTRICT_SCRIPT:-.github/scripts/registry-restrict.sh}" "$base/sources.json" "$base/reachability.json" "$report" &&
               [ -s "$report" ]; then
              node n8n/build.mjs
              git reset -q --soft HEAD~1  # la medición entera ya está en bot/registry/<rama>
              git add registry/ n8n/dist
              if git diff --cached --quiet; then
                echo "Ya estaban en la rama principal." >> "$report"
              else
                git commit -q -m "Robots.txt restrictions from the source probe (the full registry fails the tests)"
                if push_main; then
                  echo "Se escribieron en la rama principal; el resto de la medición quedó en \`bot/registry/$GITHUB_REF_NAME\`." >> "$report"
                  echo "::warning::Las restricciones de robots.txt de la medición se escribieron en $GITHUB_REF_NAME"
                else
                  echo "No se pudieron escribir en la rama principal (el rebase o el push fallaron): hay que hacerlo a mano." >> "$report"
                fi
              fi
            elif [ -s "$report" ]; then
              echo "No se escribieron en la rama principal." >> "$report"
            fi
          fi
          exit 1
      # Solo en main: es el registro que leen el recolector del Perú y n8n.
      - name: Open an issue when the new registry fails the tests
        if: always() && (steps.gate.outcome == 'failure' || steps.commit.outputs.gate == 'failure') && github.ref_name == (github.event.repository.default_branch || 'main')
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const title = '[datos] El registro medido no pasa las pruebas';
            const { data: open } = await github.rest.issues.listForRepo({ ...context.repo, state: 'open', labels: 'incidente-datos', per_page: 100 });
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const where = `\`bot/registry/${context.ref.replace('refs/heads/', '')}\``;
            const report = `${process.env.RUNNER_TEMP}/registry-restricted.md`;
            const restricted = fs.existsSync(report) ? `\n\n${fs.readFileSync(report, 'utf8').trim()}` : '';
            const body = `La sonda semanal ${url} midió las fuentes, pero con el registro nuevo fallan las pruebas: si cambió, quedó en la rama ${where} y no en la principal, así que el recolector del Perú y n8n siguen con el anterior, salvo lo que la medición restringe por robots.txt. Ver los pasos «Test the new registry» y «Commit».${restricted}\n\n<!-- enso-fp:registry-gate -->`;
            const prev = open.find(i => (i.body || '').includes('enso-fp:registry-gate'));
            if (prev) await github.rest.issues.createComment({ ...context.repo, issue_number: prev.number, body: `Volvió a fallar: ${url}${restricted}` });
            else await github.rest.issues.create({ ...context.repo, title, body, labels: ['incidente-datos'] });
      - name: Close the registry issue after a registry that passes
        if: success() && steps.gate.outcome == 'success' && github.ref_name == (github.event.repository.default_branch || 'main')
        uses: actions/github-script@v8
        with:
          script: |
            const { data: open } = await github.rest.issues.listForRepo({ ...context.repo, state: 'open', labels: 'incidente-datos', per_page: 100 });
            for (const i of open.filter(i => (i.body || '').includes('enso-fp:registry-gate'))) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: i.number, body: 'El registro medido volvió a pasar las pruebas y está en la rama principal. Se cierra automáticamente.' });
              await github.rest.issues.update({ ...context.repo, issue_number: i.number, state: 'closed', state_reason: 'completed' });
            }
