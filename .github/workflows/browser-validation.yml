# Validación cross-browser con Playwright (Chromium, Firefox, WebKit).
#
# Este workflow ejecuta tests Playwright en tres navegadores para verificar
# que el sitio funciona correctamente en todos los motores web principales.
# WebKit requiere dependencias del sistema que se instalan con
# `playwright install-deps webkit`.
name: browser-validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Diario a las 05:17 UTC (después del pipeline de datos)
    - cron: '17 5 * * *'

permissions:
  contents: read

concurrency:
  group: browser-validation
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
        viewport:
          - { w: 1280, h: 900, name: desktop }
          - { w: 390, h: 844, name: mobile-iphone13 }
          - { w: 320, h: 568, name: mobile-iphone-se }

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install playwright httpx

      - name: Install Playwright browsers
        env:
          PLAYWRIGHT_BROWSERS_PATH: /home/runner/.cache/ms-playwright
        run: |
          # Install the browser binary
          python -m playwright install ${{ matrix.browser }}

      - name: Install system dependencies (WebKit/Firefox)
        if: matrix.browser != 'chromium'
        run: |
          # Install OS-level libraries needed by WebKit and Firefox.
          # This requires sudo and is only needed for non-Chromium browsers.
          sudo apt-get update -qq
          if [ "${{ matrix.browser }}" = "webkit" ]; then
            sudo apt-get install -y -qq \
              libwoff1 libopus0 libwebp7 libwebpdemux2 libegl1 \
              libgles2 libevent-2.1-7 libxcomposite1 libxcursor1 \
              libxdamage1 libxfixes3 libxi6 libxkbcommon0 libxrandr2 \
              libxrender1 libxtst6 libatk1.0-0 libatk-bridge2.0-0 \
              libepoxy0 libgl1 libgles2 libegl1 libenchant-2-2 \
              libsecret-1-0 libmanette-0.2-0 libgstreamer1.0-0 \
              libgstreamer-plugins-base1.0-0 libgstreamer-plugins-bad1.0-0 \
              gir1.2-gst-plugins-bad-1.0 libhyphen0 libgudev-1.0-0 \
              libwoff1 libatk1.0-0 libxkbfile1 2>/dev/null || true
            # Also try the Playwright deps installer as fallback
            python -m playwright install-deps webkit 2>/dev/null || true
          elif [ "${{ matrix.browser }}" = "firefox" ]; then
            sudo apt-get install -y -qq \
              libdbus-glib-1-2 libxt6 libasound2 2>/dev/null || true
            python -m playwright install-deps firefox 2>/dev/null || true
          fi

      - name: Install system dependencies (Chromium)
        if: matrix.browser == 'chromium'
        run: |
          sudo apt-get update -qq
          python -m playwright install-deps chromium 2>/dev/null || true

      - name: Start static server
        run: |
          cd public
          python3 -m http.server 8765 &
          echo $! > /tmp/server.pid
          sleep 2
          curl -s -o /dev/null -w "%{http_code}" http://localhost:8765/index.html

      - name: Run Playwright validation
        env:
          BROWSER: ${{ matrix.browser }}
          VIEWPORT_W: ${{ matrix.viewport.w }}
          VIEWPORT_H: ${{ matrix.viewport.h }}
          VIEWPORT_NAME: ${{ matrix.viewport.name }}
        run: |
          python3 - <<'PYEOF'
          import json, os, sys, traceback
          from playwright.sync_api import sync_playwright

          BROWSER = os.environ["BROWSER"]
          VW = int(os.environ["VIEWPORT_W"])
          VH = int(os.environ["VIEWPORT_H"])
          VNAME = os.environ["VIEWPORT_NAME"]
          URL = "http://localhost:8765/index.html"

          VIEWS = [
              "overview", "coastal", "basin", "sst", "winds",
              "thermocline", "soi", "status", "historical", "maps",
              "data", "methodology", "sources", "chatbot",
          ]

          errors = []
          overflow_views = []

          with sync_playwright() as p:
              launcher = getattr(p, BROWSER)
              try:
                  browser = launcher.launch(headless=True)
              except Exception as e:
                  print(f"FAILED to launch {BROWSER}: {e}")
                  sys.exit(1)

              ctx = browser.new_context(viewport={"width": VW, "height": VH})
              page = ctx.new_page()
              page.on("pageerror", lambda e: errors.append(str(e)))
              page.on("console", lambda m: errors.append(f"console.{m.type}: {m.text}") if m.type == "error" else None)

              try:
                  page.goto(URL, wait_until="networkidle", timeout=30000)
              except Exception as e:
                  print(f"FAILED to load page: {e}")
                  browser.close()
                  sys.exit(1)

              tut = page.evaluate("typeof TUTORIAL_STEPS !== 'undefined' ? TUTORIAL_STEPS.length : 0")
              icen = page.evaluate("typeof STATUS !== 'undefined' ? STATUS.coastal.icen : null")
              roni = page.evaluate("typeof STATUS !== 'undefined' ? STATUS.basin.roni : null")
              d20 = page.evaluate("typeof STATUS !== 'undefined' ? STATUS.thermocline.d20Anom : null")
              u850 = page.evaluate("typeof STATUS !== 'undefined' ? STATUS.winds.u850Anom : null")

              for v in VIEWS:
                  try:
                      page.evaluate(f'navigate("{v}")')
                      of = page.evaluate("document.body.scrollWidth - window.innerWidth")
                      if of > 0:
                          overflow_views.append({"view": v, "overflow": of})
                  except Exception as e:
                      errors.append(f"navigate({v}): {e}")

              browser.close()

          # Report
          print(f"Browser: {BROWSER}")
          print(f"Viewport: {VW}x{VH} ({VNAME})")
          print(f"Tutorial modules: {tut}")
          print(f"ICEN: {icen}")
          print(f"RONI: {roni}")
          print(f"D20: {d20}")
          print(f"u850: {u850}")
          print(f"Errors: {len(errors)}")
          print(f"Overflow views: {len(overflow_views)}")
          if errors:
              for e in errors[:5]:
                  print(f"  ERR: {e[:200]}")
          if overflow_views:
              for o in overflow_views[:5]:
                  print(f"  OF: {o}")

          # Exit code
          if errors or overflow_views or tut != 13:
              sys.exit(1)
          if icen is None or roni is None:
              print("WARNING: ICEN or RONI is None — data may not have loaded")
              sys.exit(1)
          print("ALL CHECKS PASSED")
          PYEOF

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-${{ matrix.browser }}-${{ matrix.viewport.name }}
          path: |
            /tmp/server.pid
          retention-days: 7
