# Flujos de n8n (n8n/): pruebas del código de los nodos, que dist/ esté al
# día, prueba de punta a punta con n8n de verdad (versiones 2.x y 1.x) contra
# una API de GitHub falsa, y la validación de fuentes corrida en n8n desde un
# servidor de GitHub (Azure, EE. UU.), como referencia para el n8n en AWS.
name: n8n

on:
  push:
    branches: ['claude/**']
    paths:
      - 'n8n/**'
      - 'registry/sources.json'
      - 'python/enso/fetch.py'
      - '.github/workflows/n8n.yml'
  pull_request:
    paths:
      - 'n8n/**'
      - 'registry/sources.json'
      - 'python/enso/fetch.py'
      - '.github/workflows/n8n.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 13 * * 1'

permissions:
  contents: read

concurrency:
  group: n8n-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -r python/requirements-dev.txt
      - name: Node tests (code that runs inside the n8n Code nodes)
        run: node --test n8n/test/*.test.mjs
      - name: dist/ matches the source
        run: node n8n/build.mjs --check
      - name: The pipeline reads n8n copies
        working-directory: python
        run: python -m pytest -q tests/test_relay_n8n.py tests/test_relay.py

  n8n-real:
    needs: pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        image: ['n8nio/n8n:2.44.4', 'n8nio/n8n:1.123.85']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -r python/requirements.txt
      - name: Node types and versions used by the workflows exist in this n8n
        run: |
          docker run --rm -u root -v "$PWD:/w" --entrypoint sh "${{ matrix.image }}" -c \
            "n8n export:nodes --output=/w/nodes.json >/dev/null 2>&1"
          node n8n/test/check-node-types.mjs nodes.json n8n/dist/*.json
      - name: Collector end to end (ENFEN sources, two runs, fake GitHub API)
        run: n8n/test/e2e.sh "${{ matrix.image }}" "$RUNNER_TEMP/e2e" enfen
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: n8n-e2e-${{ strategy.job-index }}
          path: |
            ${{ runner.temp }}/e2e/*.log
            ${{ runner.temp }}/e2e/copia/index.json
            ${{ runner.temp }}/e2e/copia/heartbeat.json
          retention-days: 14

  alcance:
    needs: pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Validation workflow in n8n against every registry source
        run: |
          mkdir -p "$RUNNER_TEMP/v" && chmod 777 "$RUNNER_TEMP/v"
          cp n8n/dist/enso-n8n-validacion.json "$RUNNER_TEMP/v/"
          docker run --rm --network host -u root -v "$RUNNER_TEMP/v:/w" -e N8N_USER_FOLDER=/w/home \
            --entrypoint sh n8nio/n8n:2.44.4 -c \
            "n8n import:workflow --input=/w/enso-n8n-validacion.json && n8n execute --id=EnsoValidacion01 --rawOutput" \
            > "$RUNNER_TEMP/v/run.log" 2>&1 || { tail -50 "$RUNNER_TEMP/v/run.log"; exit 1; }
          sed -n '/^{/,$p' "$RUNNER_TEMP/v/run.log" \
            | jq '[.data.resultData.runData.Informe[0].data.main[0][].json]' > validacion-actions.json
          {
            echo "### n8n desde GitHub Actions (Azure, EE. UU.)"
            jq -r '.[0].resultado + "  \n" + .[0].veredicto + "  \n" + .[0].grupo' validacion-actions.json
            echo
            echo "| resultado | alcance | bloqueo | HTTP | id | URL | nota |"
            echo "|---|---|---|---|---|---|---|"
            jq -r '.[1:][] | select(.resultado != "OK") | "| \(.veredicto) | \(.alcance) | \(.bloqueo) | \(.http) | \(.id) | \(.url) | \(.nota | gsub("\\|"; "/") | .[0:80]) |"' validacion-actions.json
          } >> "$GITHUB_STEP_SUMMARY"
      - name: The same feeds through variants of n8n's HTTP node (which option makes n8n abort?)
        run: |
          mkdir -p "$RUNNER_TEMP/x" && chmod 777 "$RUNNER_TEMP/x"
          node n8n/test/experimento-http.mjs > "$RUNNER_TEMP/x/exp.json"
          docker run --rm --network host -u root -v "$RUNNER_TEMP/x:/w" -e N8N_USER_FOLDER=/w/home \
            --entrypoint sh n8nio/n8n:2.44.4 -c \
            "n8n import:workflow --input=/w/exp.json && n8n execute --id=EnsoExperimento1 --rawOutput" \
            > "$RUNNER_TEMP/x/out.log" 2>&1 || true
          { echo; echo "### Variantes del nodo HTTP de n8n"; echo; node n8n/test/experimento-http.mjs --resultado "$RUNNER_TEMP/x/out.log"; } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Same failed URLs with curl and with Node fetch (is it the network or n8n?)
        run: |
          UA="Observatorio-ENSO-Peru/4.0 (+https://github.com/PillB/observatorio-enso-peru; datos abiertos; n8n)"
          {
            echo; echo "### Fallas de n8n repetidas con curl y con Node (fetch)"
            echo; echo "| URL | curl: HTTP, bytes, s (IPv4) | curl IPv6 | Node fetch |"; echo "|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          for h in enfen.imarpe.gob.pe www.gob.pe www.senamhi.gob.pe; do
            echo "DNS $h: sistema=$(getent ahostsv4 "$h" | head -1 | cut -d' ' -f1) 1.1.1.1=$(dig +short @1.1.1.1 "$h" | tail -1) 8.8.8.8=$(dig +short @8.8.8.8 "$h" | tail -1)" | tee -a "$GITHUB_STEP_SUMMARY"
          done
          jq -r '.[1:][] | select(.resultado != "OK") | .url' validacion-actions.json | sort -u | head -40 | while read -r u; do
            c4=$(curl -4 -sg -o /dev/null -A "$UA" -H 'Accept: */*' --compressed -w '%{http_code} %{size_download} %{time_total}' --max-time 20 "$u" 2>&1 || true)
            c6=$(curl -6 -sg -o /dev/null -A "$UA" --max-time 20 -w '%{http_code} %{time_total}' "$u" 2>&1 || true)
            nf=$(node -e '
              const t0 = Date.now();
              fetch(process.argv[1], { headers: { "user-agent": process.argv[2], accept: "*/*" }, signal: AbortSignal.timeout(20000) })
                .then(async (r) => { const b = await r.arrayBuffer(); console.log(r.status, b.byteLength, ((Date.now() - t0) / 1000).toFixed(1)); })
                .catch((e) => console.log("error", (e.cause && e.cause.code) || e.name, ((Date.now() - t0) / 1000).toFixed(1)));
            ' "$u" "$UA")
            echo "| ${u:0:90} | $c4 | $c6 | $nf |" | tee -a "$GITHUB_STEP_SUMMARY"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: n8n-validacion-actions
          path: validacion-actions.json
          retention-days: 30
