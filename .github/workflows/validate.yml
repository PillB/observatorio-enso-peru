# Validación en PR: lint + tests + paridad de datos.
#
# Se ejecuta en cada pull request que toque python/, docs/ o workflows.
# Garantiza que el pipeline pasa los contratos y que los artefactos
# producidos son consistentes con la capa de datos TS.
name: validate

on:
  pull_request:
    paths:
      - 'python/**'
      - 'docs/**'
      - '.github/workflows/**'
      - 'src/lib/enso/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: python/requirements.txt
      - name: Install deps (minimal for lint)
        run: |
          pip install ruff pydantic
      - name: Ruff check
        run: |
          ruff check python/enso python/tests || true
      - name: Import smoke test
        run: |
          cd python && python -c "import enso; print(enso.__version__)"

  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: python/requirements.txt
      - name: Install dependencies
        working-directory: python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run pytest
        working-directory: python
        run: |
          python -m pytest -q --tb=short

  data-parity:
    runs-on: ubuntu-latest
    needs: pytest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: python/requirements.txt
      - name: Install dependencies
        working-directory: python
        run: |
          pip install -r requirements.txt
      - name: Validate canonical publication artifacts
        working-directory: python
        env:
          ENSO_DATA_DIR: ../public/data
        run: |
          python -m enso.publication_validator
      - name: Parity check (Python ↔ TS identifiers)
        working-directory: python
        run: |
          python - <<'PY'
          import json, re, pathlib
          # Lee los IDs del registro Python.
          from enso.sources import SOURCES
          from enso.methodology import INDICATORS
          py_source_ids = {s.id for s in SOURCES}
          py_ind_ids = {i.id for i in INDICATORS}
          # Lee los IDs del registro TS.
          ts_root = pathlib.Path("../src/lib/enso")
          ts_sources = ts_root / "sources.ts"
          ts_methods = ts_root / "methodology.ts"
          ts_src_text = ts_sources.read_text(encoding="utf-8")
          ts_met_text = ts_methods.read_text(encoding="utf-8")
          ts_source_ids = set(re.findall(r'id:\s*"([^"]+)"', ts_src_text))
          ts_ind_ids = set(re.findall(r'id:\s*"([^"]+)"', ts_met_text))
          assert py_source_ids == ts_source_ids, (
              f"source IDs divergen:\n"
              f"  solo en Python: {py_source_ids - ts_source_ids}\n"
              f"  solo en TS: {ts_source_ids - py_source_ids}"
          )
          assert py_ind_ids == ts_ind_ids, (
              f"indicator IDs divergen:\n"
              f"  solo en Python: {py_ind_ids - ts_ind_ids}\n"
              f"  solo en TS: {ts_ind_ids - py_ind_ids}"
          )
          print("Paridad Python ↔ TS: OK")
          PY
