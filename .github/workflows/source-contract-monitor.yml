# Monitor de contratos de fuentes del Observatorio ENSO Perú.
# Verifica que los endpoints de las fuentes siguen respondiendo y que los
# esquemas no han cambiado.
name: source-contract-monitor

on:
  schedule:
    # Diariamente a las 06:00 UTC (01:00 America/Lima)
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: enso-source-contract-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install bounded probe dependencies
        run: pip install httpx

      - name: Check source registry
        run: |
          if [ ! -f public/data/source-registry.json ]; then
            echo "::error::source-registry.json no existe"
            exit 1
          fi

          # Verify each source has required fields
          python3 -c "
          import json
          with open('public/data/source-registry.json') as f:
              data = json.load(f)
          required = ['id', 'institution', 'product', 'url', 'status', 'updateFrequency', 'license']
          for src in data.get('sources', []):
              missing = [f for f in required if f not in src or not src[f]]
              if missing:
                  print(f'::warning::Fuente {src.get(\"id\",\"?\")} falta campos: {missing}')
              else:
                  print(f'OK: {src[\"id\"]} - {src[\"institution\"]}')
          print('Contrato de fuentes verificado')
          "

      - name: Probe live source contracts
        id: canaries
        continue-on-error: true
        working-directory: python
        run: python -m enso.source_canaries

      - name: Preserve contract evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-contract-evidence-${{ github.run_id }}
          path: audit/freshness-and-automation/source-canary-results.json
          if-no-files-found: error
          retention-days: 30

      - name: Open or update schema-drift finding and fail closed
        if: steps.canaries.outcome != 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Source contract drift or endpoint failure';
            const body = [
              'One or more bounded live source canaries failed.',
              '',
              `Workflow: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              'The previous valid production publication was preserved. Incompatible data was not accepted.'
            ].join('\n');
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });
            const existing = open.data.find(issue => issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number, body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body
              });
            }
            core.setFailed('Live source-contract canaries failed; see preserved evidence.');
