# Categorías oficiales del Índice Costero El Niño (ICEN)
# Fuente: Nota Técnica ENFEN 01-2024, «Definición operacional de los eventos
# El Niño Costero y La Niña Costera en el Perú» (vigente desde diciembre de 2024).
# https://enfen.imarpe.gob.pe/download/nota-tecnica-enfen-01-2024-definicion-operacional-de-los-eventos-el-nino-costero-y-la-nina-costera-en-el-peru/
#
# ICEN: media móvil de 3 meses de la anomalía mensual de TSM ERSSTv5 en
# Niño 1+2 (90°–80°O, 10°S–0°), con bases de 30 años centradas que se
# actualizan cada 5 años (método ONI de NOAA); base vigente 1991–2020.
# Evento: al menos 3 meses consecutivos en condición cálida o fría.
# Magnitud del evento: la máxima categoría alcanzada.
#
# Este archivo documenta las categorías que aplica python/enso/signals.py;
# una prueba verifica que ambos coincidan. Umbrales anteriores (2012):
# −1,4 / −1,2 / −1,0 / +0,4 / +1,0 / +1,7 / +3,0.
policy_id: enfen-icen-2024
source_type: VERIFIED
units: degC
categories:
  - { label: "Fría fuerte",            range: "< −1,3",         examples: [-1.31, -2.0] }
  - { label: "Fría moderada",          range: "[−1,3; −1,1)",   examples: [-1.3, -1.11] }
  - { label: "Fría débil",             range: "[−1,1; −0,7)",   examples: [-1.1, -0.71] }
  - { label: "Neutra",                 range: "[−0,7; +0,5]",   examples: [-0.7, 0.0, 0.5] }
  - { label: "Cálida débil",           range: "(+0,5; +1,3]",   examples: [0.51, 1.3] }
  - { label: "Cálida moderada",        range: "(+1,3; +2,1]",   examples: [1.31, 2.1] }
  - { label: "Cálida fuerte",          range: "(+2,1; +3,5]",   examples: [2.11, 3.5] }
  - { label: "Cálida extraordinaria",  range: "> +3,5",         examples: [3.51, 4.5] }
