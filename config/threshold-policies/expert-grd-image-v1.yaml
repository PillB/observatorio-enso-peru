# Política de umbrales operativos del experto GRD — versión 1
# ============================================================================
# Transcripción exacta de la imagen suministrada por el equipo de
# GRD / climatología / geología. Estos umbrales NO constituyen una
# metodología oficial de NOAA ni de ENFEN. Son una señal operativa
# del experto, separada de las clasificaciones científicas oficiales.
#
# Artefacto de origen:
#   - Imagen original: expert-grd-image-v1.png
#   - SHA-256: pendiente de cálculo (imagen no adjunta como archivo)
#   - Fecha de recepción: 2026-08-06
#   - Descripción de la fuente: imagen de tabla de umbrales operativos
#     suministrada por el equipo GRD para uso interno del observatorio.
#   - Estado de aprobación: BORRADOR — pendiente de aprobación formal
#   - Versión de la política: expert-grd-image-v1
#
# AMBIGÜEDADES DOCUMENTADAS:
#   Los intervalos no especificados en la imagen se marcan como
#   UNCLASSIFIED_BY_EXPERT_POLICY. No se asume normalidad en los huecos.
# ============================================================================

policy_id: "expert-grd-image-v1"
policy_name: "Señal operativa del experto GRD (imagen v1)"
source_type: "EXPERT_POLICY"
source_description: >
  Tabla de umbrales operativos (semáforo) suministrada por el equipo de
  GRD / climatología / geología. No equivale al sistema oficial de alertas
  de NOAA ni de ENFEN.
receipt_date: "2026-08-06"
approval_status: "DRAFT"
version: "v1"

# ---------------------------------------------------------------------------
# 2.1 SST — costero Niño 1+2
# ---------------------------------------------------------------------------
coastal_sst:
  metric: "Niño 1+2 SST anomaly"
  region: "Niño 1+2 (0–10°S, 90–80°W)"
  demonstration_value: 2.7
  demonstration_classification: "red"
  open_questions:
    - "¿Es Niño 1+2 semanal, mensual, ICEN o ICEN temporal?"
    - "¿Los extremos son inclusivos?"
    - "¿Cómo manejar el intervalo entre +2.0 y +2.1?"
    - "¿Cómo manejar entre +0.5 y +1.3?"
    - "¿Cómo clasificar anomalías frías por debajo de −0.7?"
  rules:
    - label: "Normal"
      color: "green"
      min: -0.7
      max: 0.5
      min_inclusive: true
      max_inclusive: true
    - label: "Amarillo"
      color: "yellow"
      min: 1.3
      max: 2.0
      min_inclusive: true
      max_inclusive: true
      note: "Tal como aparece en la imagen: +1.3 a +2.0"
    - label: "Rojo"
      color: "red"
      min: 2.1
      max: null
      min_inclusive: true
      note: "Mayor que +2.1"
  unclassified_intervals:
    - { range: "> +0.5 to < +1.3", reason: "No definido en la imagen del experto" }
    - { range: "> +2.0 to < +2.1", reason: "Brecha entre amarillo y rojo" }
    - { range: "< −0.7", reason: "No definido para anomalías frías costeras" }

# ---------------------------------------------------------------------------
# 2.2 SST — cuenca Niño 3.4
# ---------------------------------------------------------------------------
basin_sst:
  metric: "Niño 3.4 SST anomaly"
  region: "Niño 3.4 (5°S–5°N, 120–170°W)"
  demonstration_value: 1.2
  demonstration_classification: "yellow"
  rules:
    - label: "Normal"
      color: "green"
      min: -0.5
      max: 0.5
      min_inclusive: true
      max_inclusive: true
    - label: "Amarillo"
      color: "yellow"
      min: 1.0
      max: 1.5
      min_inclusive: false
      max_inclusive: true
      note: "Por encima de +1.0 hasta +1.5"
    - label: "Rojo"
      color: "red"
      min: 1.5
      max: null
      min_inclusive: false
      note: "Por encima de +1.5"
  unclassified_intervals:
    - { range: "> +0.5 to ≤ +1.0", reason: "No definido en la imagen del experto" }
    - { range: "< −0.5", reason: "No definido para anomalías frías de cuenca" }

# ---------------------------------------------------------------------------
# 2.3 Vientos
# ---------------------------------------------------------------------------
winds:
  metric: "Zonal wind direction"
  level: "PENDIENTE_DE_CONFIRMAR (¿850 hPa? ¿superficie?)"
  region: "PENDIENTE_DE_CONFIRMAR"
  actual_vs_anomaly: "PENDIENTE_DE_CONFIRMAR"
  demonstration_status: "west-to-east"
  demonstration_classification: "red"
  rules:
    - label: "Normal"
      color: "green"
      direction: "east-to-west"
    - label: "Rojo"
      color: "red"
      direction: "west-to-east"
  yellow_rule: null
  note: >
    No automatizar hasta confirmar: región exacta, nivel de presión,
    valor observado vs anomalía, duración requerida, cobertura requerida,
    magnitud mínima y convención de signo zonal.
    No clasificar un estado costero o de cuenca completo a partir de
    una frase textual aislada o una sola celda de grilla.

# ---------------------------------------------------------------------------
# 2.4 Termoclina (D20)
# ---------------------------------------------------------------------------
thermocline:
  metric: "D20 anomaly (depth of 20°C isotherm)"
  unit: "m"
  coastal_demonstration_value: 52
  coastal_demonstration_classification: "red"
  global_demonstration_value: 38
  global_demonstration_classification: "yellow"
  scopes:
    coastal:
      region: "PENDIENTE_DE_CONFIRMAR (Pacífico oriental / Niño 1+2)"
      product: "PENDIENTE_DE_CONFIRMAR (GODAS / otro)"
    basin:
      region: "PENDIENTE_DE_CONFIRMAR (promedio ecuatorial)"
      product: "PENDIENTE_DE_CONFIRMAR (GODAS / otro)"
  rules:
    - label: "Normal"
      color: "green"
      min: -20
      max: 20
      min_inclusive: true
      max_inclusive: true
    - label: "Amarillo"
      color: "yellow"
      min: 30
      max: 50
      min_inclusive: true
      max_inclusive: true
    - label: "Rojo"
      color: "red"
      min: 50
      max: null
      min_inclusive: false
      note: "Mayor que 50 m"
  unclassified_intervals:
    - { range: "> +20 to < 30", reason: "Brecha entre normal y amarillo" }
    - { range: "< −20", reason: "No definido para anomalías negativas profundas" }
  note: >
    Identificar el producto D20 exacto usado para cada alcance.
    No etiquetar un valor en 95°W, 0° como un promedio de toda la cuenca.

# ---------------------------------------------------------------------------
# 2.5 SOI
# ---------------------------------------------------------------------------
soi:
  metric: "Southern Oscillation Index"
  formulation: "PENDIENTE_DE_CONFIRMAR (¿mensual? ¿30 días? ¿60 días? ¿90 días? ¿NOAA CPC? ¿BoM Troup?)"
  demonstration_value: -14.50
  demonstration_classification: "red"
  rules:
    - label: "Normal"
      color: "green"
      min: -7
      max: 7
      min_inclusive: true
      max_inclusive: true
    - label: "Rojo"
      color: "red"
      max: -7
      max_inclusive: false
      note: "Menor que −7"
  yellow_rule: null
  positive_side_rule: null
  note: >
    No crear «SOI costero».
    No clasificar valores por encima de +7 como verdes simplemente
    porque la imagen carece de regla para el lado positivo.
    Aplicar la regla solo a una serie SOI compatible verificada.
  unclassified_intervals:
    - { range: "> +7", reason: "No hay regla para el lado positivo en la imagen del experto" }
